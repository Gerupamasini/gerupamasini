<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ミミイカの3D水槽</title>
<style>
:root{--bg:#07090c;--fg:#cfd8e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090c;--fg:#cfd8e3}}
:root[data-theme="dark"]{--bg:#07090c;--fg:#cfd8e3}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#info{position:fixed;left:16px;right:16px;bottom:12px;text-align:center;font-size:12px;opacity:.65;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="info">ドラッグで回転・ホイール/ピンチでズーム ／ 水中をタップで餌 ／ 放っておくとミミイカは砂に潜ります</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

// ---------- 基本 ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07090c);
{const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.35;}
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.05,50);
camera.position.set(0.7,1.15,3.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.72,0);controls.enableDamping=true;controls.minDistance=2.6;controls.maxDistance=8;
controls.maxPolarAngle=Math.PI*0.5;controls.enablePan=false;controls.update();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// 水槽寸法
const TW=3.0,TH=1.6,TD=1.4,G=0.02;           // 幅・高さ・奥行・ガラス厚
const SAND=0.26,WATER=1.46;                    // 砂面・水面の高さ
const LDIR=new THREE.Vector3(0.18,1,0.12).normalize(); // 光（上から）

// ---------- 共通シェーダ断片：コースティクス ----------
const CAUSTIC=`
float caustic(vec2 uv,float t){
  vec2 p=mod(uv*6.28318,6.28318)-250.0; vec2 i=p; float c=1.0; float inten=0.005;
  for(int n=0;n<5;n++){float tt=t*(1.0-(3.5/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
    c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}
  c/=5.0; c=1.17-pow(c,1.4); return pow(abs(c),8.0);
}
float causticRGB(vec3 wp,float t,float blur){
  vec3 L=normalize(vec3(${LDIR.x},${LDIR.y},${LDIR.z}));
  vec2 uv=(wp.xz+L.xz/L.y*(${WATER.toFixed(3)}-wp.y))*0.55;
  float a=caustic(uv,t*0.5), b=caustic(uv*0.5+3.1,t*0.37);
  return mix(a*0.7+b*0.5,0.35,blur);
}`;
const uTime={value:0};

// ---------- 部屋・台 ----------
const room=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x111418,roughness:1}));
room.rotation.x=-Math.PI/2;room.position.y=-0.55;room.receiveShadow=true;scene.add(room);
const back=new THREE.Mesh(new THREE.PlaneGeometry(30,12),new THREE.MeshStandardMaterial({color:0x0d1015,roughness:1}));back.position.set(0,5,-3);scene.add(back);
const stand=new THREE.Mesh(new THREE.BoxGeometry(TW+0.3,0.55,TD+0.3),new THREE.MeshStandardMaterial({color:0x1d1a17,roughness:0.6}));
stand.position.y=-0.275;stand.receiveShadow=true;stand.castShadow=true;scene.add(stand);
// 照明器具（上部）
const lampMat=new THREE.MeshStandardMaterial({color:0x22262b,roughness:0.4,metalness:0.6});
const lamp=new THREE.Mesh(new THREE.BoxGeometry(TW*0.9,0.05,0.22),lampMat);lamp.position.set(0,TH+0.22,0);scene.add(lamp);
const lampFace=new THREE.Mesh(new THREE.PlaneGeometry(TW*0.86,0.16),new THREE.MeshBasicMaterial({color:0xdff4ff}));
lampFace.rotation.x=Math.PI/2;lampFace.position.set(0,TH+0.194,0);scene.add(lampFace);
for(const sx of[-1,1]){const leg=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.22,0.03),lampMat);leg.position.set(sx*TW*0.44,TH+0.1,0);scene.add(leg);}

// ---------- ライト ----------
scene.add(new THREE.HemisphereLight(0x9fc6e0,0x1a140c,0.35));
const sun=new THREE.DirectionalLight(0xe8f6ff,1.5);sun.position.copy(LDIR).multiplyScalar(6);sun.target.position.set(0,0,0);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-2,right:2,top:2,bottom:-2,near:1,far:12});sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.01;
scene.add(sun,sun.target);


// ---------- 砂 ----------
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 return (hash(ix,iy)*(1-u)+hash(ix+1,iy)*u)*(1-v)+(hash(ix,iy+1)*(1-u)+hash(ix+1,iy+1)*u)*v;}
function sandH(x,z){return SAND+(vnoise(x*1.3+5,z*1.3)-0.5)*0.07+(vnoise(x*4,z*4)-0.5)*0.015+Math.sin(x*9+z*2+vnoise(x,z)*4)*0.004-z*0.02;}
const dents=[];// ミミイカが潜った跡
const sandGeo=new THREE.PlaneGeometry(TW-2*G,TD-2*G,180,90);sandGeo.rotateX(-Math.PI/2);
{const p=sandGeo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,sandH(p.getX(i),p.getZ(i)));sandGeo.computeVertexNormals();}
// 砂テクスチャ（粒）
function sandTex(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#cdb892';g.fillRect(0,0,512,512);
 for(let i=0;i<60000;i++){const v=Math.random();g.fillStyle=v<.45?`rgba(120,95,60,${.25+Math.random()*.3})`:v<.9?`rgba(245,235,210,${.25+Math.random()*.35})`:`rgba(60,50,40,.5)`;g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*1.5,1+Math.random()*1.5);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,2);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const sandMat=new THREE.MeshStandardMaterial({map:sandTex(),roughness:0.95});
addCaustics(sandMat,1.0);
const sand=new THREE.Mesh(sandGeo,sandMat);sand.receiveShadow=true;scene.add(sand);
// 砂の側面（ガラス越しに見える断面）
{const st=sandTex();{const c=st.image,g=c.getContext('2d');for(let y=0;y<512;y+=3){g.fillStyle=`rgba(${80+Math.random()*60},${60+Math.random()*40},30,${Math.random()*.18})`;g.fillRect(0,y+Math.sin(y)*2,512,2+Math.random()*3);}st.needsUpdate=true;st.repeat.set(3,1);}
 const sm=new THREE.MeshStandardMaterial({map:st,roughness:1,color:0xc9b48c,side:THREE.DoubleSide,emissive:0x5a4a30});
 const mk=(w,rot,x,z)=>{const g=new THREE.PlaneGeometry(w,1,120,1);const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){const u=pos.getX(i),top=pos.getY(i)>0;const wx=rot?x:u,wz=rot?-u*Math.sign(x):z;const lx=rot?x:u,lz=rot?u:z;
   pos.setXYZ(i,lx,top?sandH(lx,lz):0.002,lz);}g.computeVertexNormals();const m=new THREE.Mesh(g,sm);scene.add(m);};
 mk(TW-2*G,false,0,TD/2-G-0.001);mk(TW-2*G,false,0,-(TD/2-G-0.001));mk(TD-2*G,true,TW/2-G-0.001,0);mk(TD-2*G,true,-(TW/2-G-0.001),0);
 const bottom=new THREE.Mesh(new THREE.BoxGeometry(TW,0.012,TD),new THREE.MeshStandardMaterial({color:0x0a0c0e}));bottom.position.y=-0.004;scene.add(bottom);}

function addCaustics(mat,strength,tint=true){
 mat.onBeforeCompile=sh=>{sh.uniforms.uTime=uTime;
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;uniform float uTime;'+CAUSTIC)
   .replace('#include <opaque_fragment>',`
    float under=step(vWP.y,${WATER.toFixed(3)});
    float cst=causticRGB(vWP,uTime,0.0)*under;
    float up=clamp(dot(normal,normalize(vec3(0.0,1.0,0.0))),0.0,1.0);
    outgoingLight+=diffuseColor.rgb*vec3(0.8,0.97,1.0)*cst*${strength.toFixed(2)}*2.2*(0.2+0.8*up);
    outgoingLight*=mix(vec3(1.0),${tint?'vec3(0.62,0.86,0.95)':'vec3(0.9,0.97,1.0)'},under);
    #include <opaque_fragment>`);
 };}

// ---------- 水ボリューム（光のカーテン＋濁り、レイマーチ） ----------
const volMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.FrontSide,
 blending:THREE.CustomBlending,blendSrc:THREE.OneFactor,blendDst:THREE.OneMinusSrcAlphaFactor,
 uniforms:{uTime},
 vertexShader:`varying vec3 vWP;void main(){vec4 w=modelMatrix*vec4(position,1.0);vWP=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`varying vec3 vWP;uniform float uTime;${CAUSTIC}
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
 void main(){
  vec3 ro=cameraPosition, rd=normalize(vWP-cameraPosition);
  vec3 bmin=vec3(${(-TW/2+G).toFixed(3)},${SAND-0.05},${(-TD/2+G).toFixed(3)}), bmax=vec3(${(TW/2-G).toFixed(3)},${WATER.toFixed(3)},${(TD/2-G).toFixed(3)});
  vec3 t0=(bmin-ro)/rd,t1=(bmax-ro)/rd; vec3 tn=min(t0,t1),tf=max(t0,t1);
  float a=max(max(max(tn.x,tn.y),tn.z),0.0), b=min(min(tf.x,tf.y),tf.z);
  if(b<=a) discard;
  const int N=40; float dt=(b-a)/float(N); float t=a+dt*h(gl_FragCoord.xy+fract(uTime));
  float scat=0.0, trans=1.0; float sigma=0.42;
  for(int i=0;i<N;i++){
    vec3 p=ro+rd*t;
    if(p.y<${SAND.toFixed(3)}+0.02) break;
    float depth=clamp((${WATER.toFixed(3)}-p.y)/1.2,0.0,1.0);
    float c=causticRGB(p,uTime,depth*0.55);
    float shaft=pow(c,1.3)*2.0+0.05;
    scat+=trans*shaft*exp(-depth*1.2)*dt;
    trans*=exp(-sigma*dt);
    t+=dt;
  }
  float fog=1.0-trans;
  vec3 wc=vec3(0.03,0.20,0.27);
  vec3 col=wc*fog+vec3(0.55,0.85,1.0)*scat*0.9;
  gl_FragColor=vec4(col,fog*0.92);
 }`});
const vol=new THREE.Mesh(new THREE.BoxGeometry(TW-2*G,WATER-SAND+0.05,TD-2*G),volMat);
vol.position.y=(WATER+SAND-0.05)/2;vol.renderOrder=1;scene.add(vol);

// ---------- 水面 ----------
const surfMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uTime},
 vertexShader:`uniform float uTime;varying vec3 vWP;varying vec3 vN;
 float w(vec2 p){return sin(p.x*7.0+uTime*1.3)*0.004+sin(p.y*9.0-uTime*1.1+p.x*2.0)*0.003+sin((p.x+p.y)*15.0+uTime*2.2)*0.0015;}
 void main(){vec3 p=position;vec2 q=(modelMatrix*vec4(p,1.0)).xz;float e=0.01;float hh=w(q);
  vN=normalize(vec3(-(w(q+vec2(e,0))-hh)/e,1.0,-(w(q+vec2(0,e))-hh)/e));
  vec4 wp=modelMatrix*vec4(p,1.0);wp.y+=hh;vWP=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:`varying vec3 vWP;varying vec3 vN;
 void main(){vec3 v=normalize(cameraPosition-vWP);vec3 n=gl_FrontFacing?vN:-vN;
  float fr=pow(1.0-abs(dot(n,v)),4.0);
  vec3 L=normalize(vec3(${LDIR.x},${LDIR.y},${LDIR.z}));vec3 hv=normalize(L+v);float sp=pow(max(dot(n,hv),0.0),120.0);
  vec3 col=mix(vec3(0.10,0.30,0.38),vec3(0.75,0.9,1.0),fr);
  float a=gl_FrontFacing?0.18+fr*0.6:0.35+fr*0.5; // 下から見ると全反射気味
  gl_FragColor=vec4(col+sp*1.5,clamp(a+sp,0.0,1.0));}`});
const surfGeo=new THREE.PlaneGeometry(TW-2*G,TD-2*G,150,70);surfGeo.rotateX(-Math.PI/2);
const surf=new THREE.Mesh(surfGeo,surfMat);surf.position.y=WATER;surf.renderOrder=2;scene.add(surf);

// ---------- ガラス ----------
const glassMat=new THREE.MeshPhysicalMaterial({color:0xcfeee8,transparent:true,opacity:0.08,roughness:0.03,metalness:0,clearcoat:1,clearcoatRoughness:0.02,specularIntensity:1,depthWrite:false,side:THREE.DoubleSide,envMapIntensity:1});
const edgeMat=new THREE.MeshStandardMaterial({color:0x7fb5ad,transparent:true,opacity:0.55,roughness:0.1,depthWrite:false});
const panes=[[TW,TH,G,0,TH/2,TD/2-G/2],[TW,TH,G,0,TH/2,-TD/2+G/2],[G,TH,TD-2*G,TW/2-G/2,TH/2,0],[G,TH,TD-2*G,-TW/2+G/2,TH/2,0]];
for(const[w,h,d,x,y,z]of panes){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),glassMat);m.position.set(x,y,z);m.renderOrder=4;scene.add(m);}
// ガラスの縁（緑がかった断面）とシリコン
const eg=new THREE.EdgesGeometry(new THREE.BoxGeometry(TW,TH,TD));const edges=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x9fd0c8,transparent:true,opacity:0.6}));edges.position.y=TH/2;edges.renderOrder=5;scene.add(edges);
for(const[x,z]of[[1,1],[1,-1],[-1,1],[-1,-1]]){const s=new THREE.Mesh(new THREE.BoxGeometry(0.018,TH,0.018),edgeMat);s.position.set(x*(TW/2-G),TH/2,z*(TD/2-G));s.renderOrder=5;scene.add(s);}
// 水位ライン（メニスカス）
{const mg=new THREE.MeshBasicMaterial({color:0xcff3ff,transparent:true,opacity:0.5,depthWrite:false});
 for(const[w,rx,x,z]of[[TW-2*G,0,0,TD/2-G-0.002],[TW-2*G,0,0,-TD/2+G+0.002],[TD-2*G,1,TW/2-G-0.002,0],[TD-2*G,1,-TW/2+G+0.002,0]]){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,0.006),mg);m.position.set(x,WATER,z);if(rx)m.rotation.y=Math.PI/2;m.renderOrder=3;scene.add(m);}}

// ---------- マリンスノー ----------
const NM=500,mg=new THREE.BufferGeometry(),mp=new Float32Array(NM*3),mseed=[];
for(let i=0;i<NM;i++){mp[i*3]=(Math.random()-.5)*(TW-0.1);mp[i*3+1]=SAND+0.05+Math.random()*(WATER-SAND-0.08);mp[i*3+2]=(Math.random()-.5)*(TD-0.1);mseed.push(Math.random()*10);}
mg.setAttribute('position',new THREE.BufferAttribute(mp,3));
const motes=new THREE.Points(mg,new THREE.PointsMaterial({color:0xdff3ff,size:0.008,transparent:true,opacity:0.55,depthWrite:false,blending:THREE.AdditiveBlending}));motes.renderOrder=3;scene.add(motes);

// 砂煙
const NP=400,pg=new THREE.BufferGeometry(),pp=new Float32Array(NP*3),pv=[];for(let i=0;i<NP;i++){pp[i*3+1]=-10;pv.push({v:new THREE.Vector3(),life:0});}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const puffs=new THREE.Points(pg,new THREE.PointsMaterial({color:0xd8c6a0,size:0.012,transparent:true,opacity:0.8,depthWrite:false}));puffs.renderOrder=3;puffs.frustumCulled=false;scene.add(puffs);
let pIdx=0;function puff(x,z,str=1){const i=pIdx++%NP;pp[i*3]=x+(Math.random()-.5)*0.08;pp[i*3+1]=sandH(x,z)+0.005;pp[i*3+2]=z+(Math.random()-.5)*0.08;
 const a=Math.random()*6.28;pv[i].v.set(Math.cos(a)*0.12*str,(0.1+Math.random()*0.25)*str,Math.sin(a)*0.12*str);pv[i].life=1;}

// ---------- ミミイカ ----------
// 皮膚：半透明の乳白色＋伸縮する色素胞（クロマトフォア）＋虹色素胞の干渉色＋砂まぶし
function makeSkin(opt){
 const m=new THREE.MeshPhysicalMaterial({color:0xecd2bf,roughness:0.32,clearcoat:0.7,clearcoatRoughness:0.25,transparent:true,opacity:opt.alpha,side:opt.side||THREE.FrontSide,
  emissive:0x3b2418,emissiveIntensity:0.6,sheen:0.4,sheenColor:new THREE.Color(0x7fd8ff),depthWrite:true});
 const U={uExp:{value:0.45},uSand:{value:0},uDens:{value:opt.dens},uScale:{value:opt.scale}};m.userData.U=U;
 m.onBeforeCompile=sh=>{Object.assign(sh.uniforms,U);sh.uniforms.uTime=uTime;
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vOP;varying vec3 vWP;')
   .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvOP=position;vWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
   varying vec3 vOP;varying vec3 vWP;uniform float uTime,uExp,uSand,uDens,uScale;${CAUSTIC}
   vec3 h3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return fract(sin(p)*43758.5453);}
   // 色素胞：ボロノイの各セルが独立に拡張・収縮
   vec4 chrom(vec3 p){vec3 i=floor(p),f=fract(p);float cov=0.0;vec3 col=vec3(0.0);
    for(int z=-1;z<=1;z++)for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec3 g=vec3(x,y,z);vec3 r=h3(i+g);vec3 d=g+r-f;float dist=length(d);
     float kind=fract(r.x*7.13+r.z*3.1);float ph=r.y*6.283;float pulse=0.5+0.5*sin(uTime*(0.6+r.z*1.4)+ph);
     float rad=(0.16+0.42*uExp*(0.3+0.7*pulse))*(0.55+0.7*r.z);
     float a=1.0-smoothstep(rad*0.55,rad,dist);
     vec3 c=kind<0.6?vec3(0.22,0.07,0.04):kind<0.85?vec3(0.50,0.22,0.05):vec3(0.16,0.06,0.13); // 茶・黄・紫
     if(a>cov){cov=a;col=c;}}
    return vec4(col,cov);}`)
  .replace('#include <map_fragment>',`#include <map_fragment>
   float dors=smoothstep(-0.55,0.75,normalize(vOP).y);           // 背側ほど色素胞が密
   vec4 ch=chrom(vOP*uScale);vec4 ch2=chrom(vOP*uScale*2.3+11.0);
   float cov=max(ch.a*mix(0.3,1.0,dors),ch2.a*0.8*mix(0.2,1.0,dors))*uDens*1.35;
   vec3 cc=ch.a>ch2.a?ch.rgb:ch2.rgb;
   diffuseColor.rgb=mix(diffuseColor.rgb,cc,clamp(cov,0.0,0.95));
   diffuseColor.a=mix(diffuseColor.a,1.0,cov*0.8);
   // 砂をまぶした状態（潜砂時）
   float sandy=uSand*smoothstep(-0.2,0.4,normalize(vOP).y)*step(0.35,h3(floor(vOP*420.0)).x);
   diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.80,0.72,0.56)*(0.8+0.4*h3(floor(vOP*300.0)).y),sandy);`)
  .replace('#include <opaque_fragment>',`
   vec3 V=normalize(cameraPosition-vWP);float fr=pow(1.0-abs(dot(normal,vec3(0.0,0.0,1.0))),3.0);
   vec3 irid=0.5+0.5*cos(6.283*(fr*1.2+vec3(0.0,0.33,0.67))+2.0);   // 薄膜干渉っぽい虹色
   outgoingLight+=irid*fr*0.28*(1.0-uSand)+vec3(1.0,0.75,0.6)*fr*0.12;   // 縁が透けて明るい
   float under=step(vWP.y,${WATER.toFixed(3)});
   outgoingLight+=diffuseColor.rgb*vec3(0.8,0.97,1.0)*causticRGB(vWP,uTime,0.0)*under*0.9;
   #include <opaque_fragment>`);
 };return m;}

const food=[];
class Squid{
 constructor(i){
  const s=this.s=0.12;this.g=new THREE.Group();scene.add(this.g);this.body=new THREE.Group();this.g.add(this.body);

  {const p=lg.attributes.position;for(let k=0;k<p.count;k++){const x=p.getX(k);let y=p.getY(k),z=p.getZ(k);

  this.eyes=[];

  const pupM=new THREE.MeshStandardMaterial({color:0x020304,roughness:0.2});

  for(const z of[-1,1]){const eg=new THREE.Group();eg.position.set(0.48*s,0.1*s,z*0.45*s);eg.rotation.y=z*-0.25;
   const iris=new THREE.Mesh(new THREE.SphereGeometry(0.25*s,32,20),irisM);iris.scale.set(1.15,0.95,0.8);
   const pup=new THREE.Mesh(new THREE.SphereGeometry(0.17*s,24,16),pupM);pup.scale.set(1.25,0.9,0.5);pup.position.z=z*0.13*s;
   const cor=new THREE.Mesh(new THREE.SphereGeometry(0.265*s,32,20),corM);cor.scale.set(1.15,0.97,0.86);
   eg.add(iris,pup,cor);this.body.add(eg);this.eyes.push({g:eg});}
  // 耳ヒレ：外套膜中央の左右から生える丸い半透明のヒレ
  this.fins=[];for(const z of[-1,1]){const pv=new THREE.Group();pv.position.set(-0.4*s,0.2*s,z*0.54*s);
   const sh=new THREE.Shape();sh.moveTo(-0.3*s,0);sh.bezierCurveTo(-0.52*s,0.42*s,-0.28*s,0.78*s,0.02*s,0.74*s);sh.bezierCurveTo(0.36*s,0.7*s,0.42*s,0.3*s,0.26*s,0);sh.lineTo(-0.3*s,0);
   const fg=new THREE.ShapeGeometry(sh,24);const p=fg.attributes.position;for(let k=0;k<p.count;k++){const yy=p.getY(k);p.setZ(k,-yy*yy/(s)*0.35);}fg.computeVertexNormals(); // 少しカップ状
   const f=new THREE.Mesh(fg,finSkin);f.rotation.x=z*Math.PI/2;pv.add(f);this.body.add(pv);pv.userData.z=z;this.fins.push(pv);}
  // 腕 8本（4節で曲がる）＋触腕2本（ほぼ収納）
  this.arms=[];
  const armDef=[[0.55,0.62],[0.66,0.72],[0.74,0.8],[0.66,0.72]];
  for(let k=0;k<10;k++){const tent=k>=8;const a=tent?(k===8?-0.5:0.5):((k+0.5)/8)*Math.PI*2;
   const len=tent?0.95*s:armDef[k<4?k:7-k][0]*s*0.85;const base=new THREE.Group();

   base.userData={a,len,tent,segs:[]};let parent=base;const n=4;
   for(let j=0;j<n;j++){const r0=(tent?0.035:0.085)*s*(1-j/n*0.7),r1=(tent?0.03:0.085)*s*(1-(j+1)/n*0.7);const sl=len/n;

    const jt=new THREE.Mesh(new THREE.SphereGeometry(r1,12,8),armSkin);jt.position.x=sl;seg.add(jt);
    // 吸盤（腕の内側の白い点）
    if(false)for(let q=0;q<2;q++){const su=new THREE.Mesh(new THREE.SphereGeometry(r1*0.35,5,4),new THREE.MeshStandardMaterial({color:0xf6ece0,roughness:0.6}));su.position.set(sl*(0.3+q*0.4),-Math.sin(a)*r1*0.8,-Math.cos(a)*r1*0.8);seg.add(su);}
    parent.add(seg);base.userData.segs.push(seg);parent=seg;}
   this.body.add(base);this.arms.push(base);}
  this.g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.renderOrder=2;}});
  this.pos=new THREE.Vector3((i?0.6:-0.6),0.8,(i?-0.2:0.2));this.vel=new THREE.Vector3();this.target=this.pos.clone();
  this.yaw=i?Math.PI:0;this.t=Math.random()*10;this.state='swim';this.timer=6+Math.random()*6;this.bury=0;this.excite=0;this.blink=0;this.sand=0;this.mood=Math.random();this.pick();
 }
 pick(){this.target.set((Math.random()-.5)*(TW-0.5),SAND+0.2+Math.random()*(WATER-SAND-0.45),(Math.random()-.5)*(TD-0.45));}
 update(dt){const s=this.s;this.t+=dt;this.timer-=dt;this.blink-=dt;if(this.blink<-3-Math.random()*5)this.blink=0.14;
  const sh=sandH(this.pos.x,this.pos.z);const f=food.find(f=>!f.eaten);let speed=0.18;
  if(this.state==='swim'){
   if(f){this.target.copy(f.m.position);speed=0.42;if(this.pos.distanceTo(f.m.position)<s*1.4){f.eaten=true;scene.remove(f.m);this.excite=1;}}
   else if(this.pos.distanceTo(this.target)<0.08||Math.random()<dt*0.12)this.pick();
   if(this.timer<0&&!f){this.state='descend';this.target.set(this.pos.x+(Math.random()-.5)*0.3,0,this.pos.z+(Math.random()-.5)*0.2);}
  }else if(this.state==='descend'){this.target.y=sandH(this.target.x,this.target.z)+s*0.5;speed=0.12;
   if(this.pos.distanceTo(this.target)<0.03){this.state='burying';this.timer=2.4;}
  }else if(this.state==='burying'){this.vel.multiplyScalar(0.9);this.bury=Math.min(1,this.bury+dt*0.42);if(Math.random()<dt*40)puff(this.pos.x,this.pos.z,1);
   if(this.timer<0){this.state='buried';this.timer=7+Math.random()*7;}
  }else if(this.state==='buried'){if(this.timer<0||f){this.state='emerge';}
  }else if(this.state==='emerge'){this.bury=Math.max(0,this.bury-dt*1.1);if(Math.random()<dt*30)puff(this.pos.x,this.pos.z,1.4);
   if(this.bury<=0){this.state='swim';this.timer=10+Math.random()*10;this.pick();this.pos.y+=0.02;}}
  if(this.state==='swim'||this.state==='descend'){const d=this.target.clone().sub(this.pos);const L=d.length()||1;
   const des=d.multiplyScalar(Math.min(speed,L*1.5)/L);this.vel.lerp(des,Math.min(1,dt*1.6));
   this.vel.y+=Math.sin(this.t*2.1)*0.02*dt*10;}
  else if(this.state!=='burying'){this.vel.set(0,0,0);}
  this.pos.addScaledVector(this.vel,dt);
  // 境界
  const mx=TW/2-G-0.12,mz=TD/2-G-0.1;this.pos.x=THREE.MathUtils.clamp(this.pos.x,-mx,mx);this.pos.z=THREE.MathUtils.clamp(this.pos.z,-mz,mz);
  const floor=sandH(this.pos.x,this.pos.z)+s*0.5-this.bury*s*0.42;this.pos.y=THREE.MathUtils.clamp(this.pos.y,floor,WATER-0.1);
  // 向き（ゆっくり旋回）
  const hv=Math.hypot(this.vel.x,this.vel.z);if(hv>0.03){const want=Math.atan2(-this.vel.z,this.vel.x);let d=want-this.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));this.yaw+=d*Math.min(1,dt*2.5);}
  const pitch=THREE.MathUtils.clamp(this.vel.y*2.2,-0.4,0.4)+(this.bury>0?0.05:0);
  this.g.position.copy(this.pos);this.g.rotation.set(0,this.yaw,pitch,'YXZ');
  // ヒレのはばたき（耳のようにパタパタ）
  const swim=this.state==='swim'||this.state==='descend';
  const flap=(swim?Math.sin(this.t*11)*0.6:Math.sin(this.t*2.5)*0.12)*(1-this.bury);
  for(const fn of this.fins){fn.rotation.x=-fn.userData.z*(0.6+flap);fn.rotation.y=Math.sin(this.t*11+0.8)*0.12*(swim?1:0.2);}
  // 腕：束ねて前に伸ばし、先端がゆるく波打つ。着底時は下向きに
  const rest=this.bury>0.01||this.state==='burying';
  for(const b of this.arms){const u=b.userData;const spread=u.tent?0:0.07;
   b.rotation.set(0,-Math.cos(u.a)*spread,Math.sin(u.a)*spread+(rest?-0.35:-0.08));
   u.segs.forEach((sg,j)=>{if(!j)return;const ph=this.t*2.2+u.a*1.7+j*0.9;sg.rotation.set(0,-Math.cos(u.a)*0.05+Math.sin(ph)*0.07,Math.sin(u.a)*0.04+Math.cos(ph)*0.09-(rest?0.12:0.02));});}
  // 呼吸（外套膜のポンプ）
  const br=1+Math.sin(this.t*(swim?5:2.6))*0.04;this.mantle.scale.set(1,br,br);
  // まばたき（瞼が下りる）
  // 体色：気分と興奮で色素胞が開閉。潜ると砂をまぶす
  this.excite=Math.max(0,this.excite-dt*0.25);this.mood+=(Math.sin(this.t*0.13)*0.5+0.5-this.mood)*dt*0.2;
  const exp=0.5+0.4*this.mood+0.5*this.excite-(this.state==='buried'?0.1:0);
  for(const m of[this.skin,this.finSkin,this.armSkin]){m.userData.U.uExp.value=exp;m.userData.U.uSand.value=this.sand;}
  this.sand=THREE.MathUtils.clamp(this.sand+(this.bury>0.5?dt*0.4:-dt*0.08),0,1);
 }}
const squids=[new Squid(0),new Squid(1)];window.__aq={squids,camera,controls};

// ---------- 餌（タップ） ----------
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);

 ndc.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ndc,camera);const hit=ray.intersectObject(vol)[0];if(!hit)return;
 const p=hit.point.clone();// 手前のガラス面から少し奥へ
 p.addScaledVector(ray.ray.direction,0.25);p.x=THREE.MathUtils.clamp(p.x,-TW/2+0.1,TW/2-0.1);p.z=THREE.MathUtils.clamp(p.z,-TD/2+0.1,TD/2-0.1);p.y=Math.min(p.y,WATER-0.03);
 for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.009,8,6),new THREE.MeshStandardMaterial({color:0xf0dcc0,emissive:0x302010}));m.position.copy(p).add(new THREE.Vector3((Math.random()-.5)*.06,(Math.random()-.5)*.03,(Math.random()-.5)*.06));m.renderOrder=2;scene.add(m);food.push({m,eaten:false});}});

const clock=new THREE.Clock();
function loop(){const dt=Math.min(0.05,clock.getDelta());uTime.value+=dt;const t=uTime.value;
 for(let i=0;i<NM;i++){mp[i*3+1]+=dt*0.006*(0.5+Math.sin(mseed[i])*0.5);mp[i*3]+=Math.sin(t*0.3+mseed[i])*dt*0.004;if(mp[i*3+1]>WATER-0.02)mp[i*3+1]=SAND+0.04;}
