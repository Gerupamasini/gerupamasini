<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chaetodon auriga Studio</title>
<style>
  :root { --bg: #0b0d10; --ink: #dfe6ea; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 12px/1.4 ui-monospace, Menlo, monospace; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; opacity: .6; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">トゲチョウチョウオ Chaetodon auriga — drag to orbit</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createButterflyfish, loadPattern, loadPhoto } from './src/fish.js';
import { createFireGoby } from './src/goby.js';
import { createStrawberryConch } from './src/conch.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = +(Q.get('exp') || 1.0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
// studio backdrop: soft vertical gradient
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2a3a48'); gr.addColorStop(1, '#07090c'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
const key = new THREE.DirectionalLight(0xfff4e6, 2.6); key.position.set(1.5, 2.5, 2.2);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.002;
Object.assign(key.shadow.camera, { left: -0.8, right: 0.8, top: 0.8, bottom: -0.8, near: 0.1, far: 8 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xbfdcff, 2.0); rim.position.set(-2, 1.0, -2.5); scene.add(rim);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5); fill.position.set(-1, -0.6, 2); scene.add(fill);

const species = Q.get('species') || 'auriga';
const fish = species === 'conch' ? (() => { const c = createStrawberryConch({ live: +(Q.get('live') ?? 1) }); c.group.position.set(-0.5, 0, 0); const g = new THREE.Group(); g.add(c.group); return { group: g, update: (dt, t) => c.update(dt, t), uniforms: { uPhase: { value: 0 }, uAmp: { value: 0 }, uTurn: { value: 0 } } }; })() : species === 'goby' ? createFireGoby() : createButterflyfish(renderer, { texSize: +(Q.get('tex') || 4096), pattern: await loadPattern(), photo: Q.has('nophoto') ? null : await loadPhoto() });
scene.add(fish.group);

const camera = new THREE.PerspectiveCamera(+(Q.get('fov') || 30), innerWidth / innerHeight, 0.01, 50);
const views = {
  side: [0, 0.02, 2.6], photo: [-0.1, 0.0, 4.2], q34: [1.2, 0.35, 2.1], front: [2.3, 0.1, 0.6], top: [0.2, 2.4, 0.4],
  head: [0.75, 0.08, 0.75], headside: [0.3, 0.0, -1.0], dorsal: [-0.05, 0.55, 0.85], topd: [-0.1, 4.6, 0.001], tail: [-1.2, 0.3, 1.2], back: [-0.8, 0.2, -2.3], low: [0.6, -1.3, 1.9],
};
const view = views[Q.get('view') || 'q34'];
camera.position.set(...view);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(Q.get('view') === 'head' || Q.get('view') === 'headside' ? 0.3 : Q.get('view') === 'photo' ? -0.1 : 0, 0.0, 0);
controls.enableDamping = true;
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
if (Q.has('dump')) {   // show a baked texture full screen
  const t = fish.textures[Q.get('dump')];
  scene.clear(); scene.background = new THREE.Color(0x404040);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.33, 1.12), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
  scene.add(m); camera.position.set(0, 0, 2.1); controls.target.set(0, 0, 0); controls.update();
  renderer.toneMapping = THREE.NoToneMapping;
}

// pixel-aligned orthographic camera matching the painting space (for overlays with the traced photo)
let orthoCam = null;
if (Q.has('ortho')) {
  orthoCam = new THREE.OrthographicCamera(-0.03 - 0.5, 1.3 - 0.5, 0.6, -0.52, 0.01, 20);
  orthoCam.position.set(0, 0, -5); orthoCam.lookAt(0, 0, 0);
  scene.background = new THREE.Color(Q.get('bg') || '#303030');
}
const swim = Q.get('swim') !== '0';
const clock = new THREE.Clock();
let t = +(Q.get('t') || 0), frames = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (swim) t += dt;
  fish.update(swim ? dt : 0, t, { amp: swim ? 0.045 : 0 });
  controls.update();
  if (Q.has('strip')) {   // swim-cycle filmstrip: one view, N phases of a tail beat
    const n = +Q.get('strip'), v = views[Q.get('view') || 'top'];
    const W = innerWidth / n, H = innerHeight;
    renderer.setScissorTest(true);
    for (let i = 0; i < n; i++) {
      fish.uniforms.uPhase.value = (i / n) * Math.PI * 2; fish.uniforms.uAmp.value = +(Q.get('amp') || 0.06);
      fish.uniforms.uTurn.value = +(Q.get('turn') || 0);
      camera.position.set(...v); camera.aspect = W / H; camera.updateProjectionMatrix(); camera.lookAt(-0.1, 0, 0);
      renderer.setViewport(i * W, 0, W, H); renderer.setScissor(i * W, 0, W, H);
      renderer.render(scene, camera);
    }
    renderer.setScissorTest(false);
  } else if (Q.has('views')) {   // contact sheet: several views in a grid
    const list = Q.get('views').split(',');
    const cols = Math.ceil(Math.sqrt(list.length)), rows = Math.ceil(list.length / cols);
    const W = innerWidth / cols, H = innerHeight / rows;
    renderer.setScissorTest(true);
    list.forEach((v, i) => {
      const x = (i % cols) * W, y = innerHeight - (Math.floor(i / cols) + 1) * H;
      camera.position.set(...views[v]); camera.aspect = W / H; camera.updateProjectionMatrix();
      camera.lookAt(v === 'head' ? 0.3 : v === 'dorsal' ? -0.05 : 0, v === 'dorsal' ? 0.3 : 0, 0);
      renderer.setViewport(x, y, W, H); renderer.setScissor(x, y, W, H);
      renderer.render(scene, camera);
    });
    renderer.setScissorTest(false);
  } else renderer.render(scene, orthoCam || camera);
  if (++frames === 3) window.__ready = true;
});
</script>
</body>
</html>
