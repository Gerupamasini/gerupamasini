<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>ユビナガホンヤドカリ ラボ</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1416; color: #e8eef0; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; }
      #ui { position: fixed; top: 8px; left: 8px; background: rgba(10, 16, 18, 0.78); padding: 8px 10px; border-radius: 6px; max-width: 320px; }
      #ui label { display: block; margin: 3px 0; }
      #ui button { margin: 2px 2px 2px 0; }
      #hud { position: fixed; bottom: 8px; left: 8px; background: rgba(10, 16, 18, 0.7); padding: 6px 8px; border-radius: 6px; font-family: ui-monospace, monospace; white-space: pre; }
      body.shot #ui, body.shot #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="ui">
      <b>ユビナガホンヤドカリ <i>Pagurus minutus</i></b>
      <label>場面 <select id="mode">
        <option value="single">自由に動く</option><option value="walk">歩行</option><option value="pose">静止</option>
        <option value="retract">殻に引っ込む</option><option value="change">殻の引っ越し</option><option value="guard">交尾前ガード</option>
        <option value="group">群れと餌</option><option value="shells">殻 5 種</option><option value="naked">殻から出した体</option>
      </select></label>
      <label>視点 <select id="view">
        <option value="oblique">斜め</option><option value="macro">接写</option><option value="face">顔</option><option value="profile">横顔</option>
        <option value="front">正面</option><option value="side">側面</option><option value="top">真上</option><option value="back">後ろ</option>
        <option value="dactyl">指節</option><option value="follow">追いかける</option><option value="wide">広く</option>
      </select></label>
      <label>殻 <select id="shell"></select></label>
      <label>LOD <select id="lod"><option>0</option><option selected>1</option><option>2</option></select></label>
      <label><input type="checkbox" id="debug" /> デバッグ表示</label>
      <label><input type="checkbox" id="water" checked /> 水（浅い潮だまり）</label>
      <label><input type="checkbox" id="darkStage" /> 黒い撮影台</label>
      <label><input type="checkbox" id="camThreat" /> カメラを人として警戒させる</label>
      <label>速度 <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1" /></label>
      <button id="scare">脅かす</button><button id="food">餌</button><button id="emptyShell">空き殻</button><button id="more">個体を追加</button>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/creatures/yubinagahonyadokari/lab/lab.js"></script>
  </body>
</html>
