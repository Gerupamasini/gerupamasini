<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const R = {};
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(128, 128);
renderer.shadowMap.enabled = true;
const gl = renderer.getContext();
const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100); cam.position.z = 3;

function samplers(mat) {
  const prog = renderer.properties.get(mat).currentProgram.program;
  const out = []; const cnt = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < cnt; i++) { const u = gl.getActiveUniform(prog, i); if ([gl.SAMPLER_2D, gl.SAMPLER_CUBE, gl.SAMPLER_2D_ARRAY, gl.SAMPLER_3D, gl.SAMPLER_2D_SHADOW].includes(u.type)) out.push(u.name); }
  return out;
}
const geo = new THREE.SphereGeometry(1, 8, 4);
const pm = new THREE.PMREMGenerator(renderer); const env = pm.fromScene(new RoomEnvironment(), 0.04);
const ORM = tex();
function scene(mat, { shadow = false } = {}) {
  const s = new THREE.Scene(); s.environment = env.texture;
  const l = new THREE.DirectionalLight(0xffffff, 1); l.castShadow = shadow; s.add(l);
  const mesh = new THREE.Mesh(geo, mat); mesh.receiveShadow = shadow; mesh.castShadow = shadow; s.add(mesh); return s;
}
// A. bare
let m = new THREE.MeshPhysicalMaterial(); renderer.render(scene(m), cam); R.A_bare_physical_env = samplers(m);
// B. base PBR set: map, normal, ORM(3 slots, same texture), emissive
m = new THREE.MeshPhysicalMaterial({ map: tex(true), normalMap: tex(), roughnessMap: ORM, metalnessMap: ORM, aoMap: ORM, emissiveMap: tex(true), emissive: 0xffffff });
renderer.render(scene(m), cam); R.B_base_pbr = samplers(m);
// C. B + iridescence(+thicknessMap) + sheenColorMap + clearcoat maps
m = new THREE.MeshPhysicalMaterial({ map: tex(true), normalMap: tex(), roughnessMap: ORM, metalnessMap: ORM, aoMap: ORM, emissiveMap: tex(true), emissive: 0xffffff,
  iridescence: 1, iridescenceMap: tex(), iridescenceThicknessMap: tex(), sheen: 1, sheenColor: new THREE.Color(1, 1, 1), sheenColorMap: tex(true), sheenRoughnessMap: tex(),
  clearcoat: 1, clearcoatMap: tex(), clearcoatRoughnessMap: tex(), clearcoatNormalMap: tex() });
renderer.render(scene(m), cam); R.C_full = samplers(m);
// D. B + transmission maps + 1 shadow-casting directional light
m = new THREE.MeshPhysicalMaterial({ map: tex(true), normalMap: tex(), roughnessMap: ORM, metalnessMap: ORM, aoMap: ORM, transmission: 1, transmissionMap: tex(), thickness: 1, thicknessMap: tex() });

window.__result = R; window.__done = true;
</script>
