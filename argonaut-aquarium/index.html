<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タコフネの水槽</title>
<style>
  :root { --bg: #02121c; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #cap {
    position: fixed; left: 16px; bottom: 14px; color: rgba(210,235,245,.55);
    font: 12px/1.4 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; letter-spacing: .08em;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">タコフネ <i>Argonauta hians</i> ― 海水のみの水槽</div>
<script>
(() => {
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
let W, H, DPR, tank;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// caustics offscreen (low-res, scaled up)
const cc = document.createElement('canvas');
const cctx = cc.getContext('2d');
const CW = 160, CH = 90; cc.width = CW; cc.height = CH;
const cimg = cctx.createImageData(CW, CH);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layer.width = W * DPR; layer.height = H * DPR; lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const m = Math.max(10, Math.min(W, H) * 0.035);
  tank = { x: m, y: m * 1.2, w: W - m * 2, h: H - m * 2.2 - 30 };
  tank.water = tank.y + tank.h * 0.06;       // water surface
  tank.floor = tank.y + tank.h;              // glass floor
}
addEventListener('resize', resize);
resize();

// ---------- marine snow ----------
const motes = Array.from({ length: 140 }, () => ({
  x: Math.random(), y: Math.random(), z: Math.random(),
  s: rand(.4, 1.6), vx: rand(-.004, .004), vy: rand(.002, .01), ph: rand(0, TAU)
}));

// ---------- argonaut ----------
class Argonaut {
  constructor(i) {
    this.z = [0.35, 0.7, 1.0, 0.55][i % 4];      // depth 0 far .. 1 near
    this.size = lerp(0.55, 1.0, this.z) * rand(.9, 1.1);
    this.x = rand(.2, .8); this.y = rand(.3, .8);
    this.vx = 0; this.vy = 0;
    this.ang = rand(0, TAU);                      // heading (shell leads)
    this.pulseT = rand(0, 1); this.period = rand(1.6, 2.4);
    this.contract = 0;
    this.target = { x: rand(.15, .85), y: rand(.2, .85) };
    this.flip = 1;
    this.arms = [];
    for (let a = 0; a < 6; a++) {
      const n = 14, pts = [];
      for (let k = 0; k < n; k++) pts.push({ x: this.x, y: this.y });
      this.arms.push({ pts, len: rand(.75, 1.1) * (a < 2 ? 1.2 : 1), off: (a - 2.5) * 0.12, ph: rand(0, TAU) });
    }
    this.seed = rand(0, 100);
  }
  px() { return this.x * tank.w + tank.x; }
  py() { return this.y * (tank.floor - tank.water) + tank.water; }
  update(dt, t) {
    // wander target
    const dx = this.target.x - this.x, dy = this.target.y - this.y;
    if (dx * dx + dy * dy < .015 || Math.random() < dt * .04)
      this.target = { x: rand(.12, .88), y: rand(.15, .85) };
    // desired heading
    let want = Math.atan2(dy * (tank.floor - tank.water), dx * tank.w);
    const hor = Math.cos(want) >= 0 ? 0 : Math.PI, lim = .5;
    let dv = ((want - hor + Math.PI * 3) % TAU) - Math.PI; want = hor + clamp(dv, -lim, lim);
    let d = ((want - this.ang + Math.PI * 3) % TAU) - Math.PI;
    this.ang += d * dt * 0.6;
    // jet cycle: slow refill, quick contraction
    this.pulseT += dt / this.period;
    if (this.pulseT >= 1) { this.pulseT -= 1; this.period = rand(1.5, 2.6); }
    const p = this.pulseT;
    this.contract = p < .22 ? Math.sin(p / .22 * Math.PI) : 0;
    const thrust = this.contract * 0.13 * this.size;
    this.vx += Math.cos(this.ang) * thrust * dt;
    this.vy += Math.sin(this.ang) * thrust * dt;
    // sinks gently between pulses (shell holds air, near-neutral)
    this.vy += 0.0015 * dt;
    // keep personal space
    for (const o of argos) if (o !== this) {
      const ox = this.x - o.x, oy = (this.y - o.y) * .6, d2 = ox * ox + oy * oy;
      if (d2 < .02 && d2 > 1e-6) { this.vx += ox / d2 * .0006 * dt; this.vy += oy / d2 * .0006 * dt; }
    }
    const drag = Math.pow(0.35, dt);
    this.vx *= drag; this.vy *= drag;
    this.x += this.vx * dt; this.y += this.vy * dt;
    // soft walls
    this.x = clamp(this.x, .06, .94); this.y = clamp(this.y, .1, .92);
    // facing flip smoothing (keep shell upright)
    const f = Math.cos(this.ang) >= 0 ? 1 : -1;
    this.flip = lerp(this.flip, f, 1 - Math.pow(0.12, dt));
    // arms: follow chain, trailing behind
    const S = this.scale();
    const back = this.ang + Math.PI;
    const [lx, ly] = this.headLocal(S);
    const pit = this.pitch(), cp = Math.cos(pit), sp = Math.sin(pit);
    const hx = this.px() + (cp * lx - sp * ly) * this.flip, hy = this.py() + sp * lx + cp * ly;
    this.head = { x: hx, y: hy };
    this.arms.forEach((arm, ai) => {
      const seg = 3.9 * S * arm.len * (1 - this.contract * 0.12);
      const P = arm.pts;
      P[0].x = hx; P[0].y = hy;
      for (let k = 1; k < P.length; k++) {
        const kk = k / P.length;
        const wave = Math.sin(t * 2.4 - k * 0.55 + arm.ph) * 0.22 * kk
                   + (this.contract > 0 ? -this.contract * 0.5 * arm.off * 3 * kk : 0);
        const curl = Math.pow(kk, 2.2) * (1.1 + .5 * Math.sin(t * .9 + arm.ph)) * (1 - this.contract * .8) * (arm.off >= 0 ? 1 : -.6);
        const fs = this.flipSign();
        const rest = back + fs * (-.3 + arm.off * (.8 + (1 - this.contract) * 1.2) + curl) + wave;
        let vx = P[k].x - P[k - 1].x, vy = P[k].y - P[k - 1].y;
        let L = Math.hypot(vx, vy) || 1;
        vx /= L; vy /= L;
        const b = 0.18 + kk * 0.14;
        vx = lerp(vx, Math.cos(rest), b); vy = lerp(vy, Math.sin(rest), b);
        L = Math.hypot(vx, vy) || 1;
        P[k].x = P[k - 1].x + vx / L * seg;
        P[k].y = P[k - 1].y + vy / L * seg;
      }
    });
  }
  headLocal(S) {
    const TH = TAU * .875;
    const [ex, ey] = this.shellPt(TH, 1, S), [ux, uy] = this.shellPt(TH - TAU, 1.25, S);
    return [lerp(ex, ux, .45) - 3 * S, lerp(ey, uy, .45) + 4 * S];
  }
  pitch() { return Math.atan2(Math.sin(this.ang), Math.abs(Math.cos(this.ang))); }
  flipSign() { return this.flip >= 0 ? 1 : -1; }
  scale() { return Math.min(W, H) / 330 * this.size; }
  draw(t) {
    const S = this.scale();
    const fog = 1 - this.z;   // far → more blue
    ctx.save();
    ctx.globalAlpha = lerp(0.55, 1, this.z);

    // arms (behind shell)
    this.arms.forEach((arm, ai) => {
      const P = arm.pts, n = P.length, L = [], Rr = [];
      for (let k = 0; k < n; k++) {
        const p0 = P[Math.max(0, k - 1)], p1 = P[Math.min(n - 1, k + 1)];
        let nx = -(p1.y - p0.y), ny = p1.x - p0.x; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
        const w = lerp(2.6, .25, Math.pow(k / (n - 1), .8)) * S * (ai < 2 ? 1.15 : 1);
        L.push([P[k].x + nx * w, P[k].y + ny * w]); Rr.push([P[k].x - nx * w, P[k].y - ny * w]);
      }
      ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
      for (let k = 1; k < n; k++) ctx.lineTo(L[k][0], L[k][1]);
      for (let k = n - 1; k >= 0; k--) ctx.lineTo(Rr[k][0], Rr[k][1]);
      ctx.closePath();
      const ag = ctx.createLinearGradient(P[0].x, P[0].y, P[n - 1].x, P[n - 1].y);
      ag.addColorStop(0, 'rgba(220,150,150,.95)'); ag.addColorStop(1, 'rgba(235,190,185,.6)');
      ctx.fillStyle = ag; ctx.fill();
      ctx.strokeStyle = 'rgba(130,60,75,.45)'; ctx.lineWidth = .6 * S; ctx.stroke();
      // suckers along the inner side
      ctx.fillStyle = 'rgba(255,230,220,.8)';
      for (let k = 1; k < n - 2; k++) {
        const [x, y] = Rr[k];
        ctx.beginPath(); ctx.arc(lerp(x, P[k].x, .35), lerp(y, P[k].y, .35), .55 * S * (1 - k / n), 0, TAU); ctx.fill();
      }
      ctx.fillStyle = 'rgba(150,50,60,.5)';
      for (let k = 2; k < n - 2; k += 2) {
        ctx.beginPath(); ctx.arc(lerp(L[k][0], P[k].x, .4), lerp(L[k][1], P[k].y, .4), .8 * S * (1 - k / n), 0, TAU); ctx.fill();
      }
    });

    ctx.translate(this.px(), this.py());
    // mirror to face travel direction (passing through 0 reads as a turn), then pitch; keel stays up
    ctx.scale(Math.abs(this.flip) < .08 ? .08 * Math.sign(this.flip || 1) : this.flip, 1);
    ctx.rotate(this.pitch());
    const pulse = 1 + this.contract * 0.04;

    this.drawShell(S, t);
    // body / head at aperture
    ctx.save();
    const [lx, ly] = this.headLocal(S); ctx.translate(lx, ly); ctx.rotate(.5);
    const bg = ctx.createRadialGradient(-2 * S, -2 * S, 1, 0, 0, 13 * S);
    bg.addColorStop(0, 'rgba(255,215,200,.95)');
    bg.addColorStop(.6, 'rgba(215,140,140,.9)');
    bg.addColorStop(1, 'rgba(140,70,90,.8)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, 10 * S * pulse, 7.5 * S, -.2, 0, TAU); ctx.fill();
    // chromatophores
    ctx.fillStyle = 'rgba(160,60,70,.5)';
    for (let i = 0; i < 18; i++) {
      const a = (i * 2.4 + this.seed) % TAU, r = ((i * 37 + this.seed * 7) % 10) / 10 * 10 * S;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r * .7, (.6 + (i % 3) * .35) * S, 0, TAU); ctx.fill();
    }
    // eye
    ctx.fillStyle = '#f4e7c8';
    ctx.beginPath(); ctx.ellipse(-4 * S, -1 * S, 4 * S, 3.4 * S, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#14100e';
    ctx.beginPath(); ctx.ellipse(-4 * S, -1 * S, 2.6 * S, 1.2 * S, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(-5 * S, -2.2 * S, .7 * S, 0, TAU); ctx.fill();
    // siphon (points backward-down, jets toward rear)
    ctx.fillStyle = 'rgba(200,120,125,.9)';
    ctx.beginPath(); ctx.ellipse(3 * S, 6.5 * S, 3.2 * S, 1.7 * S * (1 - this.contract * .3), .9, 0, TAU); ctx.fill();
    ctx.restore();


    ctx.restore();
    // jet ripple
    if (this.contract > .6) {
      ctx.save();
      ctx.globalAlpha = (this.contract - .6) * .5 * this.z;
      ctx.strokeStyle = 'rgba(200,240,255,.6)';
      ctx.lineWidth = 1;
      const bx = this.head.x - Math.cos(this.ang) * 10 * S, by = this.head.y - Math.sin(this.ang) * 10 * S;
      ctx.beginPath(); ctx.arc(bx, by, (1.2 - this.contract) * 30 * S, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }
  shellPt(th, k, S) {
    // log spiral; th=0 at spire (below centre), sweeping forward, over the keel, to the back
    const R = 40 * S, b = 0.386, TH = TAU * .875;
    const rr = R * Math.exp(b * (th - TH)) * k;
    const a = Math.PI / 2 - th;
    return [6 * S + Math.cos(a) * rr, -2 * S + Math.sin(a) * rr];
  }
  drawShell(S, t) {
    const TH = TAU * .875, P = (th, k) => this.shellPt(th, k, S);
    const [ex, ey] = P(TH, 1), [cx0, cy0] = P(0, 0);
    const outline = () => {
      ctx.beginPath();
      for (let th = 0.2; th <= TH; th += .04) { const [x, y] = P(th, 1); th === 0.2 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      // aperture lip back to the umbilicus
      const [ux, uy] = P(TH - TAU, 1.25);
      ctx.quadraticCurveTo(lerp(ex, ux, .5) + 4 * S, lerp(ey, uy, .5) + 3 * S, ux, uy);
      ctx.closePath();
    };
    // soft shadow/glow
    outline();
    ctx.save();
    ctx.shadowColor = 'rgba(0,15,25,.45)'; ctx.shadowBlur = 6 * S; ctx.shadowOffsetY = 3 * S;
    const g = ctx.createRadialGradient(cx0 - 8 * S, cy0 - 14 * S, 2 * S, cx0 - 6 * S, cy0, 40 * S);
    g.addColorStop(0, 'rgba(255,254,248,.98)');
    g.addColorStop(.55, 'rgba(240,234,218,.95)');
    g.addColorStop(1, 'rgba(196,203,204,.9)');
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
    ctx.save(); outline(); ctx.clip();
    // aperture interior (darker, translucent) near lip
    const [mx, my] = P(TH - .35, .55);
    const ig = ctx.createRadialGradient(mx, my, 0, mx, my, 16 * S);
    ig.addColorStop(0, 'rgba(120,110,105,.35)'); ig.addColorStop(1, 'rgba(120,110,105,0)');
    ctx.fillStyle = ig; ctx.fillRect(mx - 20 * S, my - 20 * S, 40 * S, 40 * S);
    // radial ribs, sinuous, from umbilicus to keel
    for (let th = .5; th < TH + .1; th += .15) {
      ctx.beginPath();
      for (let s = 0; s <= 1.0001; s += .08) {
        const k = lerp(.12, 1.03, s);
        const [x, y] = P(th - .25 * s + Math.sin(s * TAU) * .04, k);
        s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(140,128,108,.32)'; ctx.lineWidth = 1.3 * S; ctx.stroke();
      ctx.save(); ctx.translate(-.7 * S, -.5 * S);
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = .55 * S; ctx.stroke(); ctx.restore();
    }
    // silvery dorsal-arm web draped over the shell flank
    const shimmer = .5 + .5 * Math.sin(t * 1.3 + this.seed);
    ctx.beginPath();
    const wA = TH - 2.6, wB = TH + .05;
    for (let th = wA; th <= wB; th += .05) { const [x, y] = P(th, .98); th === wA ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    for (let th = wB; th >= wA; th -= .05) {
      const k = lerp(.3, .62, Math.sin((th - wA) / (wB - wA) * Math.PI * .9));
      const [x, y] = P(th, k); ctx.lineTo(x, y);
    }
    ctx.closePath();
    const wg = ctx.createLinearGradient(-30 * S, -30 * S, 30 * S, 30 * S);
    wg.addColorStop(0, `rgba(180,200,240,${.22 + shimmer * .15})`);
    wg.addColorStop(.5, `rgba(240,220,255,${.3 + shimmer * .2})`);
    wg.addColorStop(1, 'rgba(160,210,225,.18)');
    ctx.fillStyle = wg; ctx.fill();
    ctx.fillStyle = 'rgba(170,80,110,.25)';
    for (let i = 0; i < 14; i++) {
      const th = lerp(wA + .3, wB - .2, (i * .618) % 1), k = lerp(.45, .85, (i * .37) % 1);
      const [x, y] = P(th, k); ctx.beginPath(); ctx.arc(x, y, .9 * S, 0, TAU); ctx.fill();
    }
    ctx.restore();
    // keel edge line
    ctx.beginPath();
    for (let th = 0.2; th <= TH; th += .04) { const [x, y] = P(th, 1); th === 0.2 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.strokeStyle = 'rgba(150,135,110,.7)'; ctx.lineWidth = 1 * S; ctx.stroke();
    // keel tubercles (dark brown near spire, fading toward aperture)
    for (let th = .45; th < TH - .08; th += .12) {
      const [x, y] = P(th, 1.0);
      const f = th / TH;
      ctx.fillStyle = `rgba(${lerp(70, 150, f)},${lerp(45, 120, f)},${lerp(35, 95, f)},${lerp(.95, .6, f)})`;
      ctx.beginPath(); ctx.arc(x, y, lerp(.9, 2.1, f) * S, 0, TAU); ctx.fill();
    }
    // brown spire
    const [sx, sy] = P(.9, .55);
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 6 * S);
    sg.addColorStop(0, 'rgba(95,58,40,.85)'); sg.addColorStop(1, 'rgba(95,58,40,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 6 * S, 0, TAU); ctx.fill();
    // specular sheen
    ctx.save(); outline(); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
    const [hx, hy] = P(TH - 2.2, .75);
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, 14 * S);
    hg.addColorStop(0, 'rgba(255,255,255,.22)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, hy, 14 * S, 0, TAU); ctx.fill();
    ctx.restore();
  }
}
const argos = [0, 1, 2].map(i => new Argonaut(i)).sort((a, b) => a.z - b.z);

// ---------- scene ----------
function drawWater(t) {
  const { x, y, w, h, water, floor } = tank;
  // room behind
  const room = ctx.createLinearGradient(0, 0, 0, H);
  room.addColorStop(0, '#050b10'); room.addColorStop(1, '#010305');
  ctx.fillStyle = room; ctx.fillRect(0, 0, W, H);

  // air gap above water inside tank
  ctx.fillStyle = 'rgba(40,70,85,.25)';
  ctx.fillRect(x, y, w, water - y);

  // water body
  const g = ctx.createLinearGradient(0, water, 0, floor);
  g.addColorStop(0, '#2c8aa6');
  g.addColorStop(.35, '#15607e');
  g.addColorStop(.8, '#0b3b55');
  g.addColorStop(1, '#082c40');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x, water);
  for (let i = 0; i <= 60; i++) {
    const px = x + w * i / 60;
    ctx.lineTo(px, water + Math.sin(i * .6 + t * 1.6) * 1.2 + Math.sin(i * .23 - t * 1.1) * 1.4);
  }
  ctx.lineTo(x + w, floor); ctx.lineTo(x, floor); ctx.closePath();
  ctx.fill();
  ctx.save(); ctx.clip();

  // god rays
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9; i++) {
    const cx0 = x + w * ((i * .137 + .05 + Math.sin(t * .07 + i) * .03) % 1);
    const sway = Math.sin(t * .25 + i * 1.7) * w * .05;
    const bw = w * (.025 + (i % 3) * .018);
    const a = .045 + .03 * Math.sin(t * .6 + i * 2.1);
    const rg = ctx.createLinearGradient(0, water, 0, floor);
    rg.addColorStop(0, `rgba(190,245,255,${a})`);
    rg.addColorStop(1, 'rgba(190,245,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(cx0 - bw, water); ctx.lineTo(cx0 + bw, water);
    ctx.lineTo(cx0 + bw * 2.5 + sway + w * .08, floor); ctx.lineTo(cx0 - bw * .5 + sway + w * .08, floor);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

function caustics(t) {
  const d = cimg.data;
  for (let j = 0; j < CH; j++) for (let i = 0; i < CW; i++) {
    const u = i / CW * 9, v = j / CH * 5;
    let s = Math.sin(u * 1.3 + t * .8 + Math.sin(v * 1.7 + t * .5))
          + Math.sin(v * 2.1 - t * .7 + Math.sin(u * 1.1 - t * .4))
          + Math.sin((u + v) * .9 + t * .6);
    s = 1 - Math.abs(s) / 3;
    s = Math.pow(s, 6);
    const k = (j * CW + i) * 4;
    d[k] = 180; d[k + 1] = 240; d[k + 2] = 255; d[k + 3] = s * 255;
  }
  cctx.putImageData(cimg, 0, 0);
}

function drawFloor(t) {
  const { x, w, floor, water } = tank;
  // perspective: back pane is inset, floor glass is a trapezoid
  const fh = (floor - water) * .11, ins = w * .045;
  const bx0 = x + ins, bx1 = x + w - ins, by = floor - fh;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(bx0, by); ctx.lineTo(bx1, by); ctx.lineTo(x + w, floor); ctx.lineTo(x, floor); ctx.closePath();
  const fg = ctx.createLinearGradient(0, by, 0, floor);
  fg.addColorStop(0, 'rgba(20,70,90,.25)'); fg.addColorStop(1, 'rgba(70,150,170,.3)');
  ctx.fillStyle = fg; ctx.fill();
  ctx.clip();
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .42;
  ctx.drawImage(cc, x, by, w, fh);
  ctx.restore();
  // back-pane corner seams and bottom edge
  ctx.save();
  ctx.strokeStyle = 'rgba(150,215,230,.13)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(bx0, water + 2); ctx.lineTo(bx0, by); ctx.lineTo(bx1, by); ctx.lineTo(bx1, water + 2);
  ctx.moveTo(bx0, by); ctx.lineTo(x, floor); ctx.moveTo(bx1, by); ctx.lineTo(x + w, floor);
  ctx.stroke();
  // side panes slightly darker (light passes through two glass layers)
  ctx.fillStyle = 'rgba(0,20,30,.18)';
  ctx.beginPath(); ctx.moveTo(x, water); ctx.lineTo(bx0, water); ctx.lineTo(bx0, by); ctx.lineTo(x, floor); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w, water); ctx.lineTo(bx1, water); ctx.lineTo(bx1, by); ctx.lineTo(x + w, floor); ctx.fill();
  ctx.restore();
}

function drawMotes(t, dt, layerNear) {
  const { x, w, water, floor } = tank;
  for (const m of motes) {
    if ((m.z > .6) !== layerNear) continue;
    m.x += (m.vx + Math.sin(t * .3 + m.ph) * .002) * dt;
    m.y += m.vy * dt * .5;
    if (m.y > 1) { m.y = 0; m.x = Math.random(); }
    m.x = (m.x + 1) % 1;
    const px = x + m.x * w, py = water + m.y * (floor - water);
    const r = m.s * lerp(.5, 1.6, m.z);
    ctx.fillStyle = `rgba(210,240,245,${lerp(.12, .45, m.z) * (.7 + .3 * Math.sin(t + m.ph))})`;
    ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
  }
}

function drawGlass(t) {
  const { x, y, w, h, water, floor } = tank;
  // surface line (meniscus) seen from slightly below
  ctx.save();
  ctx.strokeStyle = 'rgba(210,250,255,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const px = x + w * i / 60;
    const py = water + Math.sin(i * .6 + t * 1.6) * 1.2 + Math.sin(i * .23 - t * 1.1) * 1.4;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  // underside reflection band
  const rb = ctx.createLinearGradient(0, water, 0, water + 18);
  rb.addColorStop(0, 'rgba(180,240,255,.18)'); rb.addColorStop(1, 'rgba(180,240,255,0)');
  ctx.fillStyle = rb; ctx.fillRect(x, water, w, 18);
  // vignette inside tank (depth)
  const vg = ctx.createRadialGradient(x + w / 2, water + (floor - water) * .45, Math.min(w, h) * .2, x + w / 2, water + (floor - water) * .5, Math.max(w, h) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,10,20,.55)');
  ctx.fillStyle = vg; ctx.fillRect(x, y, w, h);
  // glass edges / silicone seams
  ctx.strokeStyle = 'rgba(170,230,240,.28)'; ctx.lineWidth = 3;
  ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  ctx.strokeStyle = 'rgba(20,40,40,.6)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
  // glass sheen
  const sh = ctx.createLinearGradient(x, y, x + w * .5, y + h);
  sh.addColorStop(0, 'rgba(255,255,255,.07)'); sh.addColorStop(.25, 'rgba(255,255,255,0)');
  sh.addColorStop(.6, 'rgba(255,255,255,0)'); sh.addColorStop(.65, 'rgba(255,255,255,.035)'); sh.addColorStop(.72, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(x, y, w, h);
  // top rim & stand
  ctx.fillStyle = '#0d1a20'; ctx.fillRect(x - 4, y - 6, w + 8, 6);
  ctx.fillStyle = '#0a1216'; ctx.fillRect(x - 8, floor, w + 16, H - floor);
  ctx.fillStyle = 'rgba(120,200,220,.12)'; ctx.fillRect(x - 8, floor, w + 16, 1.5);
  ctx.restore();
}

let last = performance.now(), T = 0, cFrame = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if ((cFrame++ & 1) === 0) caustics(T);
  drawWater(T);
  drawFloor(T);
  drawMotes(T, dt, false);
  const clipTank = () => { ctx.save(); ctx.beginPath(); ctx.rect(tank.x, tank.water, tank.w, tank.floor - tank.water); ctx.clip(); };
  clipTank();
  for (const a of argos) {
    a.update(dt, T);
    const far = a.z < .7;
    if (far) { ctx = lctx; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, layer.width, layer.height); ctx.restore(); }
    a.draw(T);
    if (far) {
      ctx = mainCtx;
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.filter = `blur(${((1 - a.z) * 1.8 * DPR).toFixed(2)}px)`;
      ctx.drawImage(layer, 0, 0); ctx.restore();
    }
  }
  ctx.restore();
  drawMotes(T, dt, true);
  drawGlass(T);
  requestAnimationFrame(frame);
}
// pre-warm arm chains
for (let i = 0; i < 60; i++) argos.forEach(a => a.update(1 / 60, i / 60));
requestAnimationFrame(frame);
})();
</script>
</body>
