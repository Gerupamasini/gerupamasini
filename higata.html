<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>干潟のハゼ</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23807055'/%3E%3C/svg%3E" />
    <style>
      :root { --ink: #eef1ec; --dim: rgba(238, 241, 236, 0.62); --glass: rgba(14, 20, 18, 0.52); }
      html, body { margin: 0; height: 100%; background: #0b0f0d; color: var(--ink); overflow: hidden; font: 14px/1.6 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
      #view:active { cursor: grabbing; }
      #progress { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; background: #0b0f0d; z-index: 5; }
      #progress[hidden] { display: none; }
      #progress .bar { width: min(320px, 70vw); height: 2px; background: rgba(255, 255, 255, 0.12); }
      #progress .bar i { display: block; height: 100%; width: 0; background: #c8bfa6; transition: width 0.2s; }
      #progress.error .msg { color: #ffb4a0; max-width: 80vw; }
      .title { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); pointer-events: none; opacity: 0; transition: opacity 2s; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
      body.ready .title { opacity: 0.85; }
      .title b { font-weight: 600; letter-spacing: 0.08em; }
      .title span { display: block; color: var(--dim); font-size: 12px; }
      #help-btn { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25); background: var(--glass); color: var(--ink); font-size: 15px; cursor: pointer; backdrop-filter: blur(6px); }
      #help { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: 58px; max-width: min(330px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 10px; background: var(--glass); backdrop-filter: blur(8px); opacity: 0; transform: translateY(6px); transition: opacity 0.5s, transform 0.5s; pointer-events: none; font-size: 13px; }
      #help.show { opacity: 1; transform: none; pointer-events: auto; }
      #help dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
      #help dt { color: var(--dim); white-space: nowrap; }
      #help dd { margin: 0; }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="水深10cmの干潟にいるエドハゼとマハゼ"></canvas>
    <div id="progress"><div class="msg">読み込み中…</div><div class="bar"><i></i></div></div>
    <div class="title"><b>干潟</b><span>エドハゼ・マハゼ　水深 約10cm</span></div>
    <button id="help-btn" aria-label="操作方法">?</button>
    <div id="help">
      <dl>
        <dt>ドラッグ</dt><dd>まわりこむ</dd>
        <dt>ホイール／ピンチ</dt><dd>近づく・離れる</dd>
        <dt>ダブルクリック</dt><dd>そのハゼを見る</dd>
        <dt>F / Tab</dt><dd>次のハゼへ</dd>
        <dt>1 / 2 / 3</dt><dd>水中・水面の上・接写</dd>
        <dt>Space</dt><dd>一時停止</dd>
        <dt>P</dt><dd>ぼけ（被写界深度）の切替</dd>
        <dt>A</dt><dd>自動カメラの切替</dd>
      </dl>
      <p style="margin: 8px 0 0; color: var(--dim)">急に近づくとハゼは逃げます。エドハゼは巣穴に隠れることがあります。</p>
    </div>
    <script type="module" src="/src/scene-higata/main.js"></script>
  </body>
</html>
