<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comet Goldfish — Real-time Aquarium</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05080a; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; left: 10px; bottom: 10px; color: #cfe3ea; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,0.35); padding: 6px 9px; border-radius: 6px; pointer-events: none; white-space: pre; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .fish-label { position: absolute; transform: translate(-50%, -100%); color: #fff; font: 11px/1.2 ui-monospace, Menlo, monospace; background: rgba(0,0,0,0.55); padding: 2px 5px; border-radius: 4px; white-space: nowrap; }
      #help { position: fixed; right: 10px; bottom: 10px; color: #9fb6bd; font: 12px/1.5 system-ui, sans-serif; background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #9fc3cf; font: 14px system-ui, sans-serif; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="labels"></div>
    <div id="hud"></div>
    <div id="help">魚をクリック: 選択 ・ ガラスをクリック: タップ（驚愕刺激） ・ 上から水面をクリック / F: 給餌 ・ C: 追従カメラ ・ H: UI 表示切替</div>
    <div id="loading">Comet Goldfish — generating procedural assets…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
