<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チゴガニ Ilyoplax pusilla — 3D viewer</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#14120f; --panel:#1d1a15e6; --fg:#e8e2d2; --dim:#9d9582; --acc:#4fc3e6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui { position:fixed; top:0; right:0; bottom:0; width:310px; background:var(--panel); backdrop-filter:blur(6px); overflow-y:auto; padding:12px; border-left:1px solid #ffffff14; }
  h1 { font-size:15px; margin:0 0 2px; } h1 i { font-weight:400; color:var(--dim); }
  h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:14px 0 6px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  button, select { background:#2b271f; color:var(--fg); border:1px solid #ffffff20; border-radius:6px; padding:5px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); } button.on { background:var(--acc); color:#04222d; border-color:var(--acc); }
  label.k { display:flex; align-items:center; gap:6px; color:var(--dim); }
  #tree { max-height:34vh; overflow:auto; border:1px solid #ffffff14; border-radius:6px; padding:4px; font-size:12px; }
  #tree div { padding:1px 4px; cursor:pointer; white-space:nowrap; border-radius:4px; } #tree div:hover { background:#ffffff12; } #tree div.sel { background:var(--acc); color:#04222d; }
  .sl { display:grid; grid-template-columns:18px 1fr 46px; gap:6px; align-items:center; margin:3px 0; } .sl input { width:100%; accent-color:var(--acc); } .sl span { color:var(--dim); text-align:right; font-variant-numeric:tabular-nums; }
  #hint { position:fixed; left:12px; bottom:10px; color:var(--dim); font-size:12px; text-shadow:0 1px 3px #000; pointer-events:none; }
  #sel { color:var(--acc); margin:2px 0 4px; min-height:1.4em; }
  @media (max-width:700px){ #hint{ display:none; } #ui{ width:100%; top:auto; height:46vh; border-left:0; border-top:1px solid #ffffff14; } }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>チゴガニ <i>Ilyoplax pusilla ♂</i></h1>
  <div style="color:var(--dim)">甲幅 ≈ 1 cm · 実寸 GLB（単位 m）· 表示は 100 倍</div>
  <h2>アニメーション</h2>
  <div class="row" id="clips"></div>
  <h2>ビュー</h2>
  <div class="row">
    <button data-v="front">正面</button><button data-v="back">背面</button><button data-v="top">上</button><button data-v="side">側面</button><button data-v="under">腹面</button><button data-v="claw">鋏</button><button data-v="eye">眼</button><button data-v="leg">脚</button>
  </div>
  <div class="row" style="margin-top:8px">
    <label class="k"><input type="checkbox" id="wire"> ワイヤ</label>
    <label class="k"><input type="checkbox" id="rot" checked> 自動回転</label>
    <label class="k"><input type="checkbox" id="ground" checked> 地面</label>
    <label class="k"><input type="checkbox" id="mud" checked> 泥粒</label>
  </div>
  <h2>関節（クリックまたは一覧から選択）</h2>
  <div id="sel">—</div>
  <div id="sliders"></div>
  <div class="row" style="margin-top:6px"><button id="reset">全関節リセット</button><button id="mirror" class="on">左右連動</button></div>
  <h2>階層</h2>
  <div id="tree"></div>
</div>
<div id="hint">ドラッグ: 回転 · ホイール/ピンチ: 拡大 · 右ドラッグ: 移動 · モデルをクリックで関節選択</div>
<script type="module" src="./src/viewer.js"></script>
</body>
</html>
