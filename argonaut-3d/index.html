<meta name="description" content="海水だけを張ったガラス水槽の中をタコフネが泳ぐ。水面で屈折した光がコースティクスと光の筋を作る、three.js のリアルタイム描画。">
<style>
:root{--bg:#0e1012;--ink:#d9e4e8;--dim:#7f8e95;--cyan:#5fe3ff;--gold:#e5b95a;--cream:#efe6d2;--line:rgba(95,227,255,.16)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Hiragino Sans","Noto Sans JP",monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab} canvas:active{cursor:grabbing}
details{position:fixed;left:12px;top:12px;width:236px;padding:12px 16px 14px;background:rgba(14,16,18,.86);border:1px solid var(--line);backdrop-filter:blur(6px)}
summary{cursor:pointer;list-style:none;font:20px/1.1 Georgia,"Hiragino Mincho ProN",serif;letter-spacing:.06em;color:var(--cream)}
summary::-webkit-details-marker{display:none} summary b{color:var(--cyan);font-weight:400}
label{display:flex;justify-content:space-between;margin-top:10px;color:var(--dim)} label span{color:var(--ink)}
input{width:100%;margin:5px 0 0;accent-color:var(--cyan)}
input:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
#stats{margin-top:12px;color:var(--gold);font-variant-numeric:tabular-nums}
p{margin:6px 0 0;color:var(--dim);font-size:11px} p a{color:var(--cyan)}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--dim)}
</style>

<script type="module">

// タコフネ（Argonauta）の泳ぐ海水水槽。

// ここではアヒルの代わりに、水中を泳ぐタコフネを別パスで描き（色と視点からの距離をテクスチャへ）、

const TX = 1.2, TZ = 0.55, TOP = 1.0;   // 水槽の半幅(x), 半奥行(z), 縁の高さ (m)

const TARGET = [0, 0.42, 0], FOV = 40;

// ---------------------------------------------------------------- 水面の動き
// 大きさも向きもばらばらな波を24本重ねた、ろ過ポンプに揺らされる程度の水面（CAUSTIC//LITE と同じ作り、縮尺だけ水槽向け）
const NW = 24, WAVES = [];
{
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < NW; i++) {
    const len = 0.8 * 0.1 ** (i / (NW - 1)), k = 2 * Math.PI / len, dir = i * 2.39996 + (rnd() - 0.5) * 0.9;
    WAVES.push({ k, kx: k * Math.cos(dir), kz: k * Math.sin(dir), w: Math.sqrt(9.81 * k + 0.074 * k ** 3), ph: rnd() * 6.283,
      a: 0.42 * Math.min(1, (0.37 / len) ** 2) / (k * k) * (0.6 + 0.8 * rnd()), short: len < 0.2,

}
const waveUniform = new Float32Array(NW * 4), ampUniform = new Float32Array(NW);
WAVES.forEach((W, i) => waveUniform.set([W.kx, W.kz, W.w, W.ph], i * 4));
function waveHeights(t, waves) {
  WAVES.forEach((W, i) => { ampUniform[i] = W.a * Math.max(0.1, 1 + 0.6 * (0.6 * Math.sin(W.f1 * t + W.p1) + 0.4 * Math.sin(W.f2 * t + W.p2)))
    * waves * (W.short ? 0.9 : 1); });

const $ = (id) => document.getElementById(id);
const state = { t: 0, paused: false, scale: 1, waves: 0.8, count: 4 };
const drops = [];
let splashAcc = 0;

function light() {   // 太陽: 方向, 色, 空の明るさ, 水の散乱光
  const el = +$('elev').value * Math.PI / 180, az = +$('az').value * Math.PI / 180;
  const warm = Math.min(1, el / 0.5), day = 0.35 + 0.65 * Math.min(1, el / 0.6), I = 3.2, glow = 0.35 * I * Math.sin(el) + 0.4 * day;
  return { pos: [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)], col: [I, I * (0.62 + 0.36 * warm), I * (0.38 + 0.56 * warm)],
    amb: [0.3 * day, 0.42 * day, 0.62 * day], glow: [0.01 * glow, 0.065 * glow, 0.085 * glow], day };
}

  const ix = -L[0], iy = -L[1], iz = -L[2], eta = 1 / IOR, c = -iy, k = 1 - eta * eta * (1 - c * c), m = eta * c - Math.sqrt(k);
  const r = [eta * ix, eta * iy - m, eta * iz], l = Math.hypot(...r); return r.map((v) => v / l);

// ================================================================= タコフネ
// 殻: 左右に平たい平巻きの対数らせん。放射状のひだ、竜骨に沿った二列の小突起、茶色い巻き始め。
// 体: 殻口から出る頭と目と漏斗、なびく6本の腕（背側の2本は殻の中にたたんでいる）。
// 泳ぎ: 漏斗から水を噴いて、殻を先頭にスッと進む。合間はゆっくり沈み、腕は後ろになびく。
let TILT = +(new URLSearchParams(location.search).get('tilt') ?? 0.35);
const SH = { R: 0.1, b: 0.36, turns: 1.12 };
const TH = SH.turns * Math.PI * 2;

function shellPoint(th, v, lift = 0) {   // v: 断面の角度 (0 = 竜骨, π = 内側)
  const { r, c, o } = shellFrame(th);

  const knob = 0.12 * Math.pow(Math.max(0, Math.cos(th * 15)), 6) * Math.exp(-(((Math.abs(v) - 0.33) / 0.1) ** 2));

function buildShell(THREE, thFrom, thTo, vFrom, vTo, lift, nu, nv) {
  const P = [], C = [], I = [], UV = [];

    const th = thFrom + (thTo - thFrom) * i / nu, v = vFrom + (vTo - vFrom) * j / nv;
    P.push(...shellPoint(th, v, lift));

    const f = th / TH, keel = Math.exp(-(((Math.abs(v) - 0.33) / 0.12) ** 2)) * Math.pow(Math.max(0, Math.cos(th * 15)), 4);
    const brown = Math.max(1 - f * 2.6, 0) + keel * (1 - f * 0.7) * 0.8;

// 腕: 節の鎖（先頭は頭に固定）を毎フレーム動かし、先細りの管として張り直す
const ARM_N = 20, ARM_M = 8;
function makeTube(THREE, rnd) {
  const nV = ARM_N * ARM_M, P = new Float32Array(nV * 3), N = new Float32Array(nV * 3), C = new Float32Array(nV * 3), I = [];
  for (let i = 0; i < ARM_N; i++) for (let j = 0; j < ARM_M; j++) {
    const k = (i * ARM_M + j) * 3, sucker = j >= ARM_M / 2 - 1 && j <= ARM_M / 2 + 1;   // 腕の内側は吸盤で白っぽい
    const spot = !sucker && rnd() < 0.3 ? 0.55 : 1;                                       // 色素胞の斑点
    C[k] = sucker ? 1.0 : 0.92 * spot; C[k + 1] = sucker ? 0.66 : 0.3 * spot; C[k + 2] = sucker ? 0.62 : 0.34 * spot;

    const a = i * ARM_M + j, b = i * ARM_M + (j + 1) % ARM_M;
    I.push(a, a + ARM_M, b, b, a + ARM_M, b + ARM_M);
  }

  g.setAttribute('position', new THREE.BufferAttribute(P, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('normal', new THREE.BufferAttribute(N, 3).setUsage(THREE.DynamicDrawUsage));

    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(ARM_N - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1], tz = b[2] - a[2]; const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;

    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;

class Argonaut {

    this.pos = new THREE.Vector3((rnd() * 2 - 1) * (TX - 0.35), 0.2 + rnd() * (LEVEL - 0.4), (rnd() * 2 - 1) * (TZ - 0.2));
    this.vel = new THREE.Vector3();

    const siphon = new THREE.Mesh(mats.siphonGeo, mats.skin); siphon.position.copy(mats.headPos).add(new THREE.Vector3(0.014, -0.02, 0)); siphon.rotation.z = -2.2;
    this.body.add(head, siphon);

      const eye = new THREE.Mesh(mats.eyeGeo, mats.eye); eye.position.copy(mats.headPos).add(new THREE.Vector3(-0.004, 0.008, sz * 0.021));

      eye.add(pupil); this.body.add(eye);

  for (const [sx, sy, sz, x, y, z] of [[2 * TX, e, e, 0, 0, TZ], [2 * TX, e, e, 0, 0, -TZ], [2 * TX, e, e, 0, TOP, TZ], [2 * TX, e, e, 0, TOP, -TZ],

    [e, TOP, e, TX, TOP / 2, TZ], [e, TOP, e, -TX, TOP / 2, TZ], [e, TOP, e, TX, TOP / 2, -TZ], [e, TOP, e, -TX, TOP / 2, -TZ]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(sx + e, sy, sz + e), dark);
    b.position.set(x, y, z); frame.add(b);
  }
  const sunLight = new THREE.DirectionalLight(0xffffff, 2.5), hemi = new THREE.HemisphereLight(0xbcd2ea, 0x3a3f44, 0.9);
  scene.add(skyDome, floor, sides, surface, glass, frame, sunLight, hemi);

  // ---------------------------------------------------------------- タコフネのパス
  // 色(水中での光の弱まり・コースティクス込み、水による吸収は含まない) と、視点からの距離(a) を浮動小数テクスチャへ
  const creScene = new THREE.Scene();
  const creSun = new THREE.DirectionalLight(0xffffff, 1), creHemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
  creScene.add(creSun, creSun.target, creHemi);
  const creRT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
  const creU = { uBase: { value: new THREE.Vector3(1, 1, 1) } };
  const underwater = (m) => {
    m.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, { uCaus: U.uCaus, uRefr: U.uRefr, uBase: creU.uBase });
      sh.vertexShader = 'varying vec3 vWP;\n' + sh.vertexShader.replace('#include <fog_vertex>', '#include <fog_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = `varying vec3 vWP; uniform sampler2D uCaus; uniform vec3 uRefr, uBase;
        const vec3 ABS = vec3(${ABSORB.map(f)}); const float LV = ${f(LEVEL)}; const vec2 TK = vec2(${f(TX)}, ${f(TZ)});\n` + sh.fragmentShader
        .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
          {
            float up = max(LV - vWP.y, 0.0), cr = max(-uRefr.y, 0.2);
            vec2 fp = vWP.xz + uRefr.xz * (vWP.y / cr);
            vec2 cuv = fp / (2.0 * TK) + 0.5;
            vec3 ratio = texture2D(uCaus, clamp(cuv, 0.0, 1.0)).rgb / max(uBase, vec3(1e-4));
            float k = clamp(1.0 - vWP.y / LV, 0.2, 1.0) * 0.85;
            vec3 g = 0.97 * exp(-ABS * up / cr) * mix(vec3(1.0), min(ratio, vec3(6.0)), k);
            reflectedLight.directDiffuse *= g; reflectedLight.directSpecular *= g;
            vec3 amb = exp(-ABS * up * 1.3);
            reflectedLight.indirectDiffuse *= amb; reflectedLight.indirectSpecular *= amb;
          }`)
        .replace('#include <dithering_fragment>', '#include <dithering_fragment>\n gl_FragColor.a = length(vWP - cameraPosition);');
    };
    return m;
  };
  function spotted(g) {   // 色素胞: 白っぽい地に赤褐色の点
    let q = 99; const r = () => (q = (q * 16807) % 2147483647) / 2147483647;
    const n = g.attributes.position.count, C = new Float32Array(n * 3), P = g.attributes.position;
    const spots = Array.from({ length: 70 }, () => { const u = r() * 2 - 1, a = r() * 6.283, s = Math.sqrt(1 - u * u); return [s * Math.cos(a), u, s * Math.sin(a), 0.1 + r() * 0.16]; });
    for (let i = 0; i < n; i++) {
      const x = P.getX(i), y = P.getY(i), z = P.getZ(i), l = Math.hypot(x, y, z) || 1;
      let d = 0; for (const s of spots) { const dd = Math.hypot(x / l - s[0], y / l - s[1], z / l - s[2]); if (dd < s[3]) d = Math.max(d, 1 - dd / s[3]); }
      const k = Math.min(1, d * 1.8);
      C[i * 3] = 1 - 0.3 * k; C[i * 3 + 1] = 1 - 0.6 * k; C[i * 3 + 2] = 1 - 0.55 * k;
    }
    g.setAttribute('color', new THREE.BufferAttribute(C, 3)); return g;
  }
  const mats = {
    shell: underwater(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.35, sheen: 0.4, sheenColor: new THREE.Color(0.9, 0.9, 1), side: THREE.DoubleSide, emissive: new THREE.Color(0.24, 0.23, 0.2) })),
    skin: underwater(new THREE.MeshPhysicalMaterial({ vertexColors: true, color: new THREE.Color(0.95, 0.36, 0.4), emissive: new THREE.Color(0.08, 0.02, 0.03), roughness: 0.5, sheen: 0.5, sheenColor: new THREE.Color(1, 0.8, 0.85) })),
    arm: underwater(new THREE.MeshPhysicalMaterial({ vertexColors: true, emissive: new THREE.Color(0.07, 0.02, 0.03), roughness: 0.5, sheen: 0.4, sheenColor: new THREE.Color(1, 0.8, 0.85), side: THREE.DoubleSide })),
    eye: underwater(new THREE.MeshPhysicalMaterial({ color: new THREE.Color(0.95, 0.85, 0.6), roughness: 0.2, clearcoat: 1, emissive: new THREE.Color(0.12, 0.09, 0.04) })),
    pupil: underwater(new THREE.MeshPhysicalMaterial({ color: 0x050505, roughness: 0.1, clearcoat: 1 })),
    shellGeo: buildShell(THREE, 0.35, TH, -Math.PI, Math.PI, 0, 360, 48),
    headGeo: spotted(new THREE.SphereGeometry(0.024, 36, 24)),
    siphonGeo: spotted(new THREE.CylinderGeometry(0.004, 0.008, 0.022, 14, 1, true)),
    eyeGeo: new THREE.SphereGeometry(0.0072, 20, 14),
    pupilGeo: new THREE.SphereGeometry(0.003, 14, 10),
  };
  // 殻の向きを「前 = +x（巻き始め側が先頭）, 上 = +y（竜骨）」にそろえる
  {
    const end = shellFrame(TH), ap = new THREE.Vector3(end.c[0], end.c[1], 0);   // 殻口の中心
    // 殻口の中心から巻きの中心へ向かう向き = 進む向き（殻が先）. 上 = らせんが育つ向き
    const fwd = new THREE.Vector3(-end.o[0], -end.o[1], 0), up2 = new THREE.Vector3(-end.o[1], end.o[0], 0);
    const side = new THREE.Vector3().crossVectors(fwd, up2);
    const M = new THREE.Matrix4().makeBasis(fwd, up2, side).invert();
    const tilt = new THREE.Matrix4().makeRotationZ(TILT);   // 殻口を後ろ下へ、竜骨を上に
    const center = new THREE.Vector3();
    mats.shellGeo.applyMatrix4(M).applyMatrix4(tilt);
    mats.shellGeo.computeBoundingBox(); mats.shellGeo.boundingBox.getCenter(center);
    mats.shellGeo.translate(-center.x, -center.y, 0);
    mats.headPos = ap.clone().applyMatrix4(M).applyMatrix4(tilt).sub(new THREE.Vector3(center.x, center.y, 0));
    mats.headPos.add(new THREE.Vector3(-0.012, -0.018, 0));
  }
  const argos = Array.from({ length: MAXA }, (_, i) => new Argonaut(THREE, mats, i, creScene));

  // クリックで波紋
  const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -LEVEL), hit = new THREE.Vector3();
  let down = null;
  canvas.addEventListener('pointerdown', (ev) => { down = [ev.clientX, ev.clientY, performance.now()]; });
  canvas.addEventListener('pointerup', (ev) => {
    if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 6 || performance.now() - down[2] > 500) return;
    const r = canvas.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2((ev.clientX - r.left) / r.width * 2 - 1, 1 - (ev.clientY - r.top) / r.height * 2), camera);
    if (ray.ray.intersectPlane(plane, hit) && Math.abs(hit.x) < TX && Math.abs(hit.z) < TZ) addRipple(hit.x, hit.z);
  });

  let simAcc = 0; const size = new THREE.Vector2(), buf = new THREE.Vector2();
  return {
    name: 'three.js r' + THREE.REVISION, minScale: 0.35, maxScale: Math.min(devicePixelRatio || 1, 2), target: 50, controls, setView, argos, camera,
    draw(dt, L) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (renderer.getPixelRatio() !== state.scale) renderer.setPixelRatio(state.scale);
      if (renderer.getSize(size).x !== w || size.y !== h) renderer.setSize(w, h, false);
      camera.aspect = w / Math.max(1, h);
      camera.fov = 2 * Math.atan(Math.tan(FOV * Math.PI / 360) / Math.min(1, camera.aspect)) * 180 / Math.PI;
      camera.updateProjectionMatrix();
      controls.update();
      for (simAcc = Math.min(simAcc + dt, 0.1); simAcc >= 1 / 60; simAcc -= 1 / 60) {
        for (let i = 0; i < 8; i++) dropU.set(drops.length ? drops.shift() : [0, 0, 1, 0], i * 4);
        gpu.compute();
      }
      const R = refractDown(L.pos);
      U.uTime.value = state.t; U.uDay.value = L.day;
      U.uLight.value.set(...L.pos); U.uLightCol.value.set(...L.col); U.uAmb.value.set(...L.amb); U.uGlow.value.set(...L.glow); U.uRefr.value.set(...R);
      U.uSim.value = gpu.getCurrentRenderTarget(sim).texture;
      gpu.doRenderTarget(surfMat, surfRT); U.uSurf.value = surfRT.texture;
      // タコフネを動かす
      const live = argos.filter((a, i) => i < state.count);
      argos.forEach((a, i) => a.setVisible(i < state.count));
      if (dt > 0) for (const a of live) a.step(dt, state.t, live);
      argos.forEach((a, i) => U.uArgo.value[i].set(...(a.center ? a.center.toArray() : [0, 0, 0]), i < state.count && a.center ? 0.07 * a.size : 0));
      // コースティクス
      U.uCaus.value = null;
      renderer.setRenderTarget(causRT); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(causScene, flatCam);
      U.uCaus.value = causRT.texture;
      // タコフネのパス（同じカメラ, 同じ解像度）
      const cs = Math.min(Math.max(state.scale * 1.6, 1), 2);   // タコフネは細かいので本体より高い解像度で
      buf.set(Math.round(w * cs), Math.round(h * cs));
      if (creRT.width !== buf.x || creRT.height !== buf.y) creRT.setSize(buf.x, buf.y);
      const cos = Math.max(L.pos[1], 0.05);
      creU.uBase.value.set(...ABSORB.map((a) => cos * 0.97 * Math.exp(-a * LEVEL / Math.max(-R[1], 0.2))));
      creSun.color.setRGB(...L.col); creSun.intensity = 1;
      creSun.position.set(-R[0], -R[1], -R[2]); creSun.target.position.set(0, 0, 0);
      // 水中は光が四方に散る: 空の光 + 散乱した日光, 下からは白い底板に跳ね返った光
      const sc = [0.55, 0.85, 1.0];
      creHemi.color.setRGB(...L.amb.map((a, i) => a + L.col[i] * 0.3 * sc[i]));
      creHemi.groundColor.setRGB(...L.col.map((c, i) => c * 0.22 * sc[i] * Math.max(L.pos[1], 0.1)));
      renderer.setRenderTarget(creRT); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(creScene, camera);
      renderer.setRenderTarget(null);
      U.uCre.value = creRT.texture; U.uRes.value.copy(buf);
      U.uVP.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      sunLight.position.set(...L.pos).multiplyScalar(10);
      hemi.intensity = 1.3 * L.day;
      renderer.render(scene, camera);
    },
  };
}

// ================================================================= 起動とループ
const canvas = $('view');
let R = null;
try { R = await gpuRenderer(canvas); } catch (e) { console.warn(e); $('err').style.display = 'grid'; $('ui').hidden = true; }
if (R) {
  state.scale = Math.min(devicePixelRatio || 1, 1.5);
  if (innerWidth < 640) { $('ui').open = false; R.setView(0.5, 0.25, 4.4); }
  const units = { elev: '°', az: '°', count: '匹' };
  for (const id of ['elev', 'az', 'waves', 'count']) {
    const show = () => { const x = +$(id).value; $(id + 'Out').textContent = units[id] ? x + units[id] : x.toFixed(2); };
    $(id).addEventListener('input', show); show();
  }
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
    const k = e.key.toLowerCase();
    if (k === ' ') { state.paused = !state.paused; e.preventDefault(); }
    else if (k === 'h') $('ui').hidden = !$('ui').hidden;
  });
  window.aq = { state, R, addRipple };
  let last = performance.now(), frames = 0, elapsed = 0, calmUntil = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000), live = state.paused ? 0 : dt;
    last = now; state.t += live; frames++; elapsed += dt;
    if (elapsed > 0.5) {
      const fps = frames / elapsed;
      if (fps < R.target * 0.9) { state.scale = Math.max(R.minScale, state.scale * 0.85); calmUntil = now + 2500; }
      else if (fps > R.target * 1.12 && now > calmUntil) state.scale = Math.min(R.maxScale, state.scale * 1.08);
      $('stats').textContent = `${R.name} · ${fps.toFixed(0)} fps · 解像度 ${Math.round(state.scale * 100)}%`;
      frames = 0; elapsed = 0;
    }
    state.waves = +$('waves').value; state.count = +$('count').value;
    if (live > 0) for (splashAcc += live * 1.5; splashAcc >= 1; splashAcc -= 1)   // ポンプの水流が水面をときどき乱す
      addRipple((Math.random() * 2 - 1) * TX * 0.95, (Math.random() * 2 - 1) * TZ * 0.95, (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random()) * 0.4, 0.02 + 0.03 * Math.random());
    waveHeights(state.t, state.waves);
    R.draw(live, light());
  }
  requestAnimationFrame(frame);
}
</script>
