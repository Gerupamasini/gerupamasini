<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タモ網 3D</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #c7ccce; --panel: rgba(12, 22, 24, 0.78); --line: rgba(160, 205, 210, 0.18); --text: #dde8e8; --muted: #8fa6a8; --accent: #e7b766; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; top: 12px; left: 12px; width: 280px; max-height: calc(100% - 24px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); }
  body.capture .panel { display: none; }
  h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  .label { color: var(--muted); font-size: 11px; margin: 10px 0 5px; letter-spacing: .05em; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { flex: 1 1 auto; background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 12px; cursor: pointer; }
  .seg button.on { background: rgba(231,183,102,0.2); border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 64px 1fr 34px; align-items: center; gap: 8px; margin: 4px 0; }
  .row span { color: var(--muted); font-size: 11.5px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #info { color: var(--muted); font-size: 11.5px; margin-top: 10px; white-space: pre-line; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="panel">
  <h1>干潟図鑑 タモ網</h1>
  <div class="label">道具</div><div class="seg" id="nets"></div>
  <div class="label">LOD</div><div class="seg" id="tiers"></div>
  <div class="label">場面</div><div class="seg" id="scenes"></div>
  <div class="label">表面</div>
  <div class="row"><span>濡れ</span><input id="wet" type="range" min="0" max="1" step="0.01" value="0"><span id="wetv">0</span></div>
  <div class="row"><span>泥</span><input id="mud" type="range" min="0" max="1" step="0.01" value="0"><span id="mudv">0</span></div>
  <div class="label">網袋（モーフ）</div><div id="morphs"></div>
  <div class="label">クリップ</div><div class="seg" id="clips"></div>
  <div id="info"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
