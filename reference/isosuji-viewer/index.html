<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>イソスジエビ — Palaemon pacificus</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1618; font: 12px/1.4 system-ui, sans-serif; color: #dfe9e6; }
  canvas { display: block; }
  .panel { position: fixed; background: rgba(8, 20, 22, 0.72); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px 12px; }
  #ctl { top: 12px; left: 12px; width: 230px; }
  #ctl h1 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  #ctl h1 small { display: block; font-weight: 400; font-style: italic; opacity: 0.7; }
  #ctl label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }
  #ctl input[type=range] { width: 120px; }
  #ctl button, #ctl select { width: 100%; margin-top: 4px; background: #1e3a3d; color: inherit; border: 1px solid #2f5a5e; border-radius: 4px; padding: 4px; }
  #hud { top: 12px; right: 12px; width: 250px; }
  #hud .beh { color: #ffd479; font-weight: 600; }
  #hud .grp { margin-top: 6px; opacity: 0.6; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #hud .row { display: grid; grid-template-columns: 80px 1fr 34px; align-items: center; gap: 4px; height: 14px; }
  #hud .row i { display: block; height: 5px; background: #6fc3b8; border-radius: 3px; }
  #hud .row em { font-style: normal; text-align: right; opacity: .7; }
  .tools label { justify-content: flex-start !important; }
  body.capture .panel { display: none; }
  @media (max-width: 640px) { #hud { display: none; } #ctl { width: calc(100% - 56px); } }
</style>
</head>
<body>
<div id="ctl" class="panel">
  <h1>イソスジエビ<small>Palaemon pacificus (Stimpson, 1860)</small></h1>
  <label>夜 ↔ 昼 <input id="time" type="range" min="0" max="1" step="0.01" value="0.35" /></label>
  <label>流速 <input id="flow" type="range" min="0" max="0.04" step="0.001" value="0.004" /></label>
  <label>流向 <input id="flowDir" type="range" min="0" max="360" step="1" value="0" /></label>
  <div class="tools">
    <label><input type="radio" name="tool" value="select" checked /> クリック: 個体選択</label>
    <label><input type="radio" name="tool" value="tap" /> クリック: 刺激（驚かす）</label>
    <label><input type="radio" name="tool" value="food" /> クリック: 餌を落とす</label>
  </div>
  <button id="shadowBtn">捕食者の影を通過させる</button>
  <select id="select"></select>
  <select id="force">
    <option value="">選択個体の行動を指定…</option>
    <option>IDLE</option><option>WALK</option><option>FORAGE</option><option>SLOW_SWIM</option>
    <option>HIDE</option><option>ESCAPE_BACKWARD</option><option>CLING</option>
  </select>
  <label><span>選択個体を追従</span><input id="follow" type="checkbox" checked /></label>
  <label><span>スローモーション ×0.1</span><input id="slow" type="checkbox" /></label>
</div>
<div id="hud" class="panel"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
