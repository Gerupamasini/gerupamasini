<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アマモ 3D</title>
<link rel="icon" href="data:,">
<style>
  :root { --panel: rgba(12, 22, 24, 0.78); --line: rgba(160, 205, 210, 0.18); --text: #dde8e8; --muted: #8fa6a8; --accent: #9fd36a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #9fb3b8; color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; top: 12px; left: 12px; width: 280px; max-height: calc(100% - 24px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); }
  body.capture .panel { display: none; }
  h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  .label { color: var(--muted); font-size: 11px; margin: 10px 0 5px; letter-spacing: .05em; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { flex: 1 1 auto; background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 12px; cursor: pointer; }
  .seg button.on { background: rgba(159,211,106,0.2); border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 64px 1fr 40px; align-items: center; gap: 8px; margin: 4px 0; }
  .row span { color: var(--muted); font-size: 11.5px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #info { color: var(--muted); font-size: 11.5px; margin-top: 10px; white-space: pre-line; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="panel">
  <h1>干潟図鑑 アマモ</h1>
  <div class="label">群落</div><div class="seg" id="kinds"></div>
  <div class="label">潮</div><div class="seg" id="tides"></div>
  <div class="row"><span>水深</span><input id="depth" type="range" min="-0.2" max="1.8" step="0.01"><b id="depthV"></b></div>
  <div class="label">流れと波</div>
  <div class="row"><span>潮流</span><input id="current" type="range" min="-0.25" max="0.25" step="0.005"><b id="currentV"></b></div>
  <div class="row"><span>波</span><input id="wave" type="range" min="0" max="0.25" step="0.005"><b id="waveV"></b></div>
  <div class="row"><span>時間</span><input id="speed" type="range" min="0" max="2" step="0.05"><b id="speedV"></b></div>
  <div class="label">LOD</div><div class="seg" id="lods"></div>
  <div id="info"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
