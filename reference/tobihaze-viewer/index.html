<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トビハゼ 3D</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #6f6f6f; color: #e8e8e8; font: 13px/1.45 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; top: 12px; left: 12px; background: rgba(20, 20, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 10px 12px; }
  body.capture .panel { display: none; }
  .panel button { background: rgba(255,255,255,0.06); color: inherit; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 4px 8px; margin: 2px; cursor: pointer; font: inherit; }
  #info { color: #bbb; font-size: 11.5px; margin-top: 6px; white-space: pre-line; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="panel">
  <div><b>干潟図鑑 トビハゼ</b></div>
  <div>
    <button data-view="front">正面</button><button data-view="side">側面</button><button data-view="top">背面</button>
    <button data-view="q34">斜め前</button><button data-view="macro">顔の接写</button>
  </div>
  <div><button id="clay">クレイ / 質感</button></div>
  <div id="info"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
