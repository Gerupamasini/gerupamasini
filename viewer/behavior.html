<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヤマメ 自律行動</title>
<style>
:root{--bg:#10222b;--fg:#d6e8ee;--ac:#69c0d8}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
canvas{display:block}
.panel{position:fixed;background:#0c1a21d9;border:1px solid #2c4a57;border-radius:8px;padding:8px 10px;backdrop-filter:blur(4px)}
#ui{left:8px;top:8px;max-width:calc(100vw - 16px)}
#ui button,#ui select{background:#1b3844;color:var(--fg);border:1px solid #356273;border-radius:5px;padding:3px 8px;margin:2px;cursor:pointer;font:inherit}
#ui a{color:var(--ac)}
#trace{right:8px;bottom:8px;width:min(520px,calc(100vw - 16px));max-height:44vh;overflow:auto;font:11px/1.35 ui-monospace,monospace;white-space:pre-wrap}
#trace .e{border-top:1px solid #2c4a57;padding-top:3px;margin-top:3px}
#trace .e:first-child{border-top:0;margin-top:0;padding-top:0}
#state{left:8px;bottom:8px;font:12px/1.4 ui-monospace,monospace;white-space:pre}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="ui" class="panel"></div><div id="state" class="panel"></div><div id="trace" class="panel"></div>
<script type="module">
import { createScene, presetCamera } from '/viewer/scene.js';
import { World } from '/src/behavior/world.js';
import { YamameAgent } from '/src/behavior/agent.js';
import { explain } from '/src/behavior/trace.js';
import { CFG } from '/src/behavior/config.js';
const q = new URLSearchParams(location.search);
const rock = { x: -0.9, z: 0.55, r: 0.15 };
const S = await createScene({ q, rock }); const { r, scene, cam, ctl, fish, THREE } = S;
const hideDwell = parseFloat(q.get('hide') || '20');                       // demo override of hide_dwell_s (spec default 60 s) so the return is visible; flagged in the trace as E
const cfg = { ...CFG, hide_dwell_s: { ...CFG.hide_dwell_s, v: hideDwell } };
const world = new World({ seed: parseInt(q.get('seed') || '3'), rock, u_mean: parseFloat(q.get('u') || '0.25'), drift_rate: parseFloat(q.get('drift') || '0.12'), area: { zmax: 0.35, ymin: -0.03, ymax: 0.10 } });
const agent = new YamameAgent({ body: fish, world, cfg, seed: parseInt(q.get('seed') || '3') });
// prey: tiny ellipsoids; threat: dark "person" blob
const preyGeo = new THREE.SphereGeometry(0.0028, 10, 8), preyMat = new THREE.MeshStandardMaterial({ color: 0xc9a46a, roughness: 0.6 }), preyMeshes = new Map();
const threatMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.9, 6, 12), new THREE.MeshBasicMaterial({ color: 0x07110f, transparent: true, opacity: 0.85 })); threatMesh.visible = false; scene.add(threatMesh);
const st = { follow: q.get('follow') !== '0', slow: parseFloat(q.get('slow') || '1') };
const ui = document.getElementById('ui'), stateEl = document.getElementById('state'), traceEl = document.getElementById('trace');
ui.innerHTML = '<b>ヤマメ 自律行動 (04 章の縦切り)</b> &nbsp; <a href="/viewer/index.html">→ 手動モード</a><br>';
const act = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = fn; ui.appendChild(b); };
act('脅威が歩いて接近 (1 m/s)', () => { world.addThreat({ pos: [5.2, 0.45, 0.25], vel: [-1.0, 0, 0], size: 1, shadow: true, expire: world.t + 14 }); });
act('頭上を影が通過 (3 m/s)', () => { world.addThreat({ pos: [3.2, 0.7, 0.1], vel: [-3.0, 0, 0], size: 0.8, shadow: true, expire: world.t + 3 }); });
act('餌を 1 個流す', () => { world.prey.push({ id: 'pr_u' + Math.random().toString(36).slice(2, 6), x: 1.2, z: (Math.random() - 0.5) * 0.2, y: 0.03 + Math.random() * 0.05, size_BL: 0.025, terrestrial: false, alive: true, wob: 0 }); });
const lab = (txt, el) => { const l = document.createElement('label'); l.textContent = txt + ' '; l.appendChild(el); ui.appendChild(l); };
const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = st.follow; cb.onchange = () => { st.follow = cb.checked; }; lab(' 追従', cb);
const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0.1; sl.max = 3; sl.step = 0.1; sl.value = st.slow; sl.oninput = () => { st.slow = +sl.value; }; lab(' 時間倍率', sl);
function step(dt) { agent.update(dt); }
function sync() {
  const live = new Set();
  for (const p of world.prey) { live.add(p.id); let m = preyMeshes.get(p.id); if (!m) { m = new THREE.Mesh(preyGeo, preyMat); m.scale.set(1.8, 1, 1); preyMeshes.set(p.id, m); scene.add(m); } m.position.set(p.x, p.y, p.z); m.rotation.z = Math.sin(p.wob) * 0.5; }
  for (const [id, m] of preyMeshes) if (!live.has(id)) { scene.remove(m); preyMeshes.delete(id); }
  const th = world.threats[0]; threatMesh.visible = !!th; if (th) threatMesh.position.set(th.pos[0], th.pos[1] + 0.2, th.pos[2]);
  stateEl.textContent = `state  ${agent.state}   t ${agent.sim.toFixed(0)} s\nneeds  F ${(agent.needs.F * 100).toFixed(0)}%  H ${(agent.needs.H * 100).toFixed(0)}%\nstrikes ${agent.stats.strikes}  eaten ${agent.stats.eaten}  rejected ${agent.stats.rejected}  missed ${agent.stats.missed}  flees ${agent.stats.flees}\nflow ${(agent.uLocal() * 100).toFixed(0)} cm/s   hide_dwell ${hideDwell}s (demo; spec 60 s)`;
  const last = agent.trace.last(4).reverse(); const html = last.map((e) => `<div class="e">${explain(e).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</div>`).join('');
  if (traceEl.dataset.n !== String(agent.trace.entries.length)) { traceEl.innerHTML = html; traceEl.dataset.n = agent.trace.entries.length; }
}
const clock = new THREE.Timer();
function frame(ts) {
  clock.update(ts); const dt = Math.min(clock.getDelta(), 0.05) * st.slow; for (let i = 0; i < 2; i++) step(dt / 2);
  if (st.follow) { const d = new THREE.Vector3(fish.pos.x, fish.pos.y, fish.pos.z).sub(ctl.target); ctl.target.add(d); cam.position.add(d); }
  sync(); ctl.update(); r.render(scene, cam); requestAnimationFrame(frame);
}
window.__agent = agent;
if (q.has('sim')) { // headless: ?sim=20&threat=5&cam=wide
  const T = parseFloat(q.get('sim')), thrAt = parseFloat(q.get('threat') ?? '-1'); let thr = false;
  for (let t = 0; t < T; t += 1 / 60) { if (!thr && thrAt >= 0 && t >= thrAt) { world.addThreat({ pos: [5.2, 0.45, 0.25], vel: [-1.0, 0, 0], size: 1, shadow: true, expire: world.t + 14 }); thr = true; } step(1 / 60); }
  S.gltf.scene.updateMatrixWorld(true); sync(); presetCamera(S, q.get('cam') || 'wide'); r.render(scene, cam); window.__ready = true;
} else { requestAnimationFrame(frame); window.__ready = true; }
</script></body></html>
