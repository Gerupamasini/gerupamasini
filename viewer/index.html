<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヤマメ 3D</title>
<style>
:root{--bg:#10222b;--fg:#d6e8ee;--ac:#69c0d8}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;left:8px;top:8px;max-width:calc(100vw - 16px);background:#0c1a21cc;border:1px solid #2c4a57;border-radius:8px;padding:8px 10px;backdrop-filter:blur(4px)}
#ui button,#ui select{background:#1b3844;color:var(--fg);border:1px solid #356273;border-radius:5px;padding:3px 8px;margin:2px;cursor:pointer;font:inherit}
#ui button.on{background:var(--ac);color:#04161d}
#ui label{display:inline-block;margin:2px 8px 2px 0}
#ui a{color:var(--ac)}
#hud{position:fixed;right:8px;bottom:8px;font:11px/1.35 ui-monospace,monospace;background:#0c1a21cc;border:1px solid #2c4a57;border-radius:6px;padding:4px 8px;white-space:pre}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="ui"></div><div id="hud"></div>
<script type="module">
import { createScene, presetCamera } from '/viewer/scene.js';
import { MODES } from '/src/yamame/modes.js';
const q = new URLSearchParams(location.search);
const S = await createScene({ q }); const { r, scene, cam, ctl, fish, THREE } = S;
const st = { mode: q.get('mode') || 'Idle', follow: q.get('follow') !== '0', slow: parseFloat(q.get('slow') || '1') };
const ui = document.getElementById('ui'), btns = {};
ui.innerHTML = '<b>ヤマメ (Oncorhynchus masou masou) — 手続き遊泳</b> &nbsp; <a href="/viewer/behavior.html">→ 自律行動デモ</a><br>';
for (const k of Object.keys(MODES)) { const b = document.createElement('button'); b.textContent = MODES[k].label; b.onclick = () => setMode(k); ui.appendChild(b); btns[k] = b; }
const act = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = fn; ui.appendChild(b); };
ui.appendChild(document.createElement('br'));
act('FeedingAttack (開口)', () => fish.triggerStrike(0.12 / st.slow)); act('CStartEscape ←', () => fish.triggerEscape(1)); act('CStartEscape →', () => fish.triggerEscape(-1));
const lodSel = document.createElement('select'); ['auto', '0', '1', '2'].forEach((v) => { const o = document.createElement('option'); o.value = v; o.textContent = 'LOD ' + v; lodSel.appendChild(o); }); lodSel.value = q.get('lod') || 'auto';
lodSel.onchange = () => fish.setLOD(lodSel.value === 'auto' ? null : +lodSel.value); ui.appendChild(lodSel);
const lab = (txt, el) => { const l = document.createElement('label'); l.textContent = txt + ' '; l.appendChild(el); ui.appendChild(l); };
const chk = (key) => { const c = document.createElement('input'); c.type = 'checkbox'; c.checked = st[key]; c.onchange = () => { st[key] = c.checked; }; return c; };
lab('追従', chk('follow'));
const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0.1; sl.max = 1; sl.step = 0.05; sl.value = st.slow; sl.oninput = () => { st.slow = +sl.value; }; lab('時間倍率', sl);
function setMode(k) { st.mode = k; for (const n in btns) btns[n].classList.toggle('on', n === k); }
setMode(st.mode);
const hud = document.getElementById('hud'), clock = new THREE.Timer(); let wanderOn = q.get('wander') !== '0';
function step(dt) {
  const intent = { mode: MODES[st.mode] };
  const d = Math.hypot(fish.pos.x, fish.pos.z);
  if (wanderOn && MODES[st.mode].flow_bl === 0 && d > 0.9) { const want = Math.atan2(fish.pos.z, -fish.pos.x), diff = Math.atan2(Math.sin(want - fish.heading), Math.cos(want - fish.heading)); intent.turn = Math.max(-0.9, Math.min(0.9, diff * 1.5)); }
  fish.update(dt, intent);
}
function frame(ts) {
  clock.update(ts); const dt = Math.min(clock.getDelta(), 0.05) * st.slow; step(dt);
  if (st.follow) { const d = new THREE.Vector3(fish.pos.x, fish.pos.y, fish.pos.z).sub(ctl.target); ctl.target.add(d); cam.position.add(d); }
  ctl.update(); r.render(scene, cam);
  hud.textContent = `mode ${st.mode}\nU ${fish.wave.U.toFixed(2)} BL/s  f ${fish.wave.f.toFixed(2)} Hz  A ${fish.wave.A.toFixed(3)} SL\nground ${(fish.speed / fish.SL).toFixed(2)} BL/s  heading ${(fish.heading * 57.3).toFixed(0)}°`;
  requestAnimationFrame(frame);
}
window.__fish = fish; if (q.get('lod') && q.get('lod') !== 'auto') fish.setLOD(+q.get('lod'));
if (q.has('sim')) { // headless: ?sim=3 steps 3 s of simulation and freezes; &cam=side|top|front|head|persp|tail|close|wide|low
  const T = parseFloat(q.get('sim')), strikeAt = parseFloat(q.get('strike') ?? '-1'), escAt = parseFloat(q.get('escape') ?? '-1'); let struck = false, esc = false;
  for (let t = 0; t < T; t += 1 / 60) { if (!struck && strikeAt >= 0 && t >= strikeAt) { fish.triggerStrike(0.12 * parseFloat(q.get('stretch') || '1')); struck = true; } if (!esc && escAt >= 0 && t >= escAt) { fish.triggerEscape(1); esc = true; } step(1 / 60); }
  S.gltf.scene.updateMatrixWorld(true); presetCamera(S, q.get('cam') || 'persp'); r.render(scene, cam); window.__ready = true;
} else { requestAnimationFrame(frame); window.__ready = true; }
</script></body></html>
